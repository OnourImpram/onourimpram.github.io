name: Elif V25 live publication verification
on:
  push:
    branches: [elif-v25-stage-20261002]
    paths: [.github/workflows/elif-v25-live.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://onourimpram.github.io/elif-tasarim/
      EVIDENCE_ROOT: /tmp/elif-v25-live
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7d96c6e737d865b94ca2d64326c7bd7abc437e95
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reproduce published build and prepare browser
        run: |
          mkdir -p "$EVIDENCE_ROOT"
          cd elif-tasarim/source-v12
          npm ci
          npm run build
          cmp dist/release-v25.json ../release-v25.json
          pip install playwright==1.55.0 beautifulsoup4==4.13.5
          python -m playwright install --with-deps chromium
      - name: Verify actual CDN responses against published hashes
        run: |
          python - <<'PY'
          import pathlib,json,time,hashlib,urllib.request,urllib.error,concurrent.futures,os
          root=pathlib.Path('elif-tasarim');expected=(root/'release-v25.json').read_bytes();m=json.loads(expected);base=os.environ['BASE_URL'];out=pathlib.Path(os.environ['EVIDENCE_ROOT'])
          def get(path):
              url=base+path+'?v25check=7d96c6e737d865b94ca2d64326c7bd7abc437e95'
              request=urllib.request.Request(url,headers={'Cache-Control':'no-cache','User-Agent':'Elif-V25-Publication-Check/1.0'})
              with urllib.request.urlopen(request,timeout=45) as r:return r.status,r.read(),r.headers.get('content-type')
          last=''
          for attempt in range(40):
              try:
                  status,body,_=get('release-v25.json')
                  if status==200 and body==expected:break
                  last='manifest bytes not yet equal'
              except Exception as e:last=str(e)
              time.sleep(10)
          else:raise RuntimeError('Published manifest not confirmed: '+last)
          def verify(item):
              path,f=item
              try:status,body,content_type=get(path)
              except urllib.error.HTTPError as e:
                  if path in ['.nojekyll','_headers'] and e.code==404:return {'path':path,'hostingControlNotPublic':True,'status':e.code}
                  raise
              assert status==200 and len(body)==f['bytes'] and hashlib.sha256(body).hexdigest()==f['sha256'],path
              return {'path':path,'status':status,'bytes':len(body),'sha256':f['sha256'],'pass':True,'type':content_type}
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:results=list(pool.map(verify,m['files'].items()))
          summary={'publication':'7d96c6e737d865b94ca2d64326c7bd7abc437e95','release':m['release'],'version':m['version'],'routes':len(m['routes']),'indexable':m['indexable'],'manifestMatched':True,'files':results,'verifiedFiles':sum(x.get('pass',False) for x in results),'pass':True}
          (out/'http-integrity.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2))
          print('LIVE HTTP INTEGRITY PASS',summary['verifiedFiles'],'files;',summary['routes'],'routes')
          PY
      - name: Verify live model collection, mobile pages and single 3D studio
        run: |
          cd elif-tasarim/source-v12
          failed=0
          for test in v25/browser v23-unified/browser v23/mobile-media; do
            name="${test//\//-}"
            mkdir -p "$EVIDENCE_ROOT/$name"
            if EVIDENCE_DIR="$EVIDENCE_ROOT/$name" timeout 300 python "tests/$test.py" > "$EVIDENCE_ROOT/$name/run.log" 2>&1; then
              echo "LIVE PASS $test"
            else
              cat "$EVIDENCE_ROOT/$name/run.log"
              failed=1
            fi
          done
          exit "$failed"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v25-live-evidence
          path: /tmp/elif-v25-live/
          retention-days: 14

name: Elif V11 actual public release verification
on:
  push:
    branches: [elif-v11-unified-project-20260925]
    paths: ['.github/workflows/elif-v11-live.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce exact expected release from staged source
        working-directory: elif-tasarim/source-v11
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          cmp dist/release-v11.json ../release-v11.json
      - name: Wait for approved release and verify every public file and direct route
        working-directory: elif-tasarim/source-v11
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
        run: python tests/v11/public_verify.py
      - name: Install isolated real Chromium tooling
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Actual public customer journeys, WebGL and responsive checks
        working-directory: elif-tasarim/source-v11
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
        run: |
          set -euo pipefail
          mkdir -p evidence/v11/live
          xvfb-run -a python tests/v11/acceptance.py 2>&1 | tee evidence/v11/live/acceptance.txt
          xvfb-run -a python tests/v11/followup.py 2>&1 | tee evidence/v11/live/followup.txt
          xvfb-run -a python tests/v11/matrix.py 2>&1 | tee evidence/v11/live/matrix.txt
      - name: Preserve personal homepage identity
        run: test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v11-live-evidence
          path: elif-tasarim/source-v11/evidence/v11
          retention-days: 14

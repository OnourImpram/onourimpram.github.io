name: Publish and verify restored Marmara identity
on:
  push:
    branches: [publish/marsam-restoration-071]
    paths: [.github/workflows/marsam-restoration.yml]
permissions:
  contents: read
env:
  SOURCE_COMMIT: 999e640f3f33a490087d5d774ceae3c94c217b84
  BASE_PATH: /MARSAM/
  PAGES_PREVIEW: 'true'
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OnourImpram/MARSAM
          ref: ${{ env.SOURCE_COMMIT }}
          path: .marsam-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify the exact restored application
        working-directory: .marsam-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          npm run check > verification/restoration-publish-check.log
          node scripts/budget.mjs
          node scripts/release-manifest.mjs
      - name: Stage only the generated MARSAM tree
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,subprocess,shutil
          root=Path('.marsam-source/dist');m=json.loads((root/'release.json').read_text())
          assert m['version']=='0.7.1' and m['formalApproval'] is False
          before=subprocess.check_output(['git','ls-tree','-z','HEAD']).decode().split('\0')
          preserved={line.split('\t')[1]:line.split('\t')[0].split()[2] for line in before if line and line.split('\t')[1] not in ['MARSAM','.github']}
          shutil.rmtree('MARSAM');shutil.copytree(root,'MARSAM')
          Path('.marsam-source/verification/restoration-preserved.json').write_text(json.dumps(preserved,indent=2))
          PY
          git add -- MARSAM
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(p.startswith('MARSAM/') for p in paths if p)
          PY
          git config user.name 'Onour Impram'
          git config user.email '215815131+OnourImpram@users.noreply.github.com'
          git commit -m 'build: restore Marmara heritage identity while retaining enriched catalogue'
          git push origin HEAD:publish/marsam-restoration-071
          git rev-parse HEAD > .marsam-source/verification/restoration-host-candidate.txt
          git rev-parse HEAD:MARSAM > .marsam-source/verification/restoration-host-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-restoration-staged
          path: .marsam-source/verification/restoration-*
          retention-days: 14
  verify-live:
    needs: stage
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.61.0-noble
    timeout-minutes: 18
    env:
      BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OnourImpram/MARSAM
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare route manifest and matching browser environment
        run: |
          npm run build
          python -m pip install --timeout 25 -q playwright==1.61.0
          python scripts/test-fonts.py
      - name: Wait for the deliberately promoted release
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          import json,os,time
          Path('verification').mkdir(exist_ok=True)
          url='https://onourimpram.github.io/MARSAM/release.json'
          for attempt in range(100):
              try:
                  with urlopen(url+'?source='+os.environ['SOURCE_COMMIT'],timeout=15) as r:d=json.load(r)
                  if d.get('sourceCommit')==os.environ['SOURCE_COMMIT']:
                      Path('verification/restoration-live-release.json').write_text(json.dumps(d,indent=2));break
              except Exception:pass
              time.sleep(5)
          else:raise AssertionError('Exact candidate is not public. Do not claim completion.')
          PY
      - name: Verify actual public bytes and removed homepage panels
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from concurrent.futures import ThreadPoolExecutor
          import json,hashlib,time
          m=json.loads(Path('verification/restoration-live-release.json').read_text());root=m['url']
          def check(item):
              name,meta=item
              for attempt in range(3):
                  try:
                      with urlopen(root+name+'?release=071restore',timeout=30) as r:data=r.read();assert r.status==200
                      assert hashlib.sha256(data).hexdigest()==meta['sha256'],name
                      return name
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2)
          with ThreadPoolExecutor(max_workers=8) as pool:paths=list(pool.map(check,[(k,v)for k,v in m['files'].items()if k!='.nojekyll']))
          for locale in ['tr','en','de','zh','ru','ar','id','ms']:
              with urlopen(root+locale+'/',timeout=25) as r:html=r.read().decode()
              assert 'data-release="0.7.1"' in html
              assert 'class="university-signature"' in html
              assert 'data-institution-status="planned"' in html
              assert 'class="preview-strip"' not in html and 'trust-entry' not in html
          with urlopen('https://onourimpram.github.io/',timeout=25) as r:homepage=r.read()
          assert hashlib.sha1(b'blob '+str(len(homepage)).encode()+b'\0'+homepage).hexdigest()=='501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          Path('verification/restoration-live-bytes.json').write_text(json.dumps({'passed':True,'files':len(paths),'sourceCommit':m['sourceCommit'],'unchangedPersonalHomepage':True,'eightLocaleMastheadsRestored':True,'unwantedHomepagePanelsAbsent':True},indent=2))
          PY
      - name: Exercise real public interactions and responsive composition
        shell: bash
        env:
          PREVIEW_ORIGIN: https://onourimpram.github.io
        run: |
          set -euo pipefail
          python tests/browser_e2e.py & core=$!
          python tests/scope_e2e.py & scope=$!
          python tests/heritage_e2e.py & layout=$!
          status=0
          wait "$core" || status=1
          wait "$scope" || status=1
          wait "$layout" || status=1
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-restoration-live
          path: |
            verification/restoration-live-*
            verification/reading-room-*.json
            .browser-results/reading-room/
          include-hidden-files: true
          retention-days: 14

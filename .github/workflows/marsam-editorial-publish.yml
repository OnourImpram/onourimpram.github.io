name: Publish and verify MARSAM editorial design
on:
  push:
    branches: [publish/marsam-editorial-05]
    paths: [.github/workflows/marsam-editorial-publish.yml]
permissions:
  contents: read
env:
  SOURCE_COMMIT: 1795948e7a903f747711028e71603fa00536a16c
  BASE_PATH: /MARSAM/
  PAGES_PREVIEW: 'true'
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OnourImpram/MARSAM
          ref: ${{ env.SOURCE_COMMIT }}
          path: .marsam-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the pinned source and all content boundaries
        working-directory: .marsam-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p verification
          BASE_PATH=/ npm run check > verification/editorial-release-root.log
          npm run check > verification/editorial-release-pages.log
          python -m pip install -q playwright==1.57.0
          python -m playwright install chromium
          python tests/scope_e2e.py
      - name: Replace only the generated MARSAM directory
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,shutil,os,subprocess
          root=Path('.marsam-source/dist');m=json.loads((root/'build-manifest.json').read_text())
          assert m['base']=='/MARSAM/' and m['version']=='0.5.0'
          assert m['previewDeploymentAuthorized'] is True and m['publicationAuthorized'] is False
          assert m['institution']['formalApprovalVerified'] is False
          m['deploymentCommit']=os.environ['SOURCE_COMMIT'];m['deploymentHost']='OnourImpram/onourimpram.github.io'
          (root/'build-manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          allowed={'.html','.css','.js','.json','.svg','.png','.webp','.txt','.ris','.bib'};files={}
          for f in root.rglob('*'):
              if not f.is_file():continue
              assert not f.is_symlink()
              assert f.suffix in allowed or f.name in {'.nojekyll','_headers'},str(f)
              files[f.relative_to(root).as_posix()]={'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size}
          r={'release':'marsam-editorial-0.5.0','sourceCommit':os.environ['SOURCE_COMMIT'],'url':'https://onourimpram.github.io/MARSAM/','mode':'institutional-review','formalApproval':False,'files':files}
          (root/'release.json').write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          old=json.loads(Path('MARSAM/release.json').read_text())
          assert old['mode']=='institutional-review'
          shutil.rmtree('MARSAM');shutil.copytree(root,'MARSAM')
          assert subprocess.check_output(['git','hash-object','index.html']).decode().strip()=='501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          PY
      - name: Stage the isolated candidate, without publishing other files
        shell: bash
        run: |
          set -euo pipefail
          git add -- MARSAM
          python - <<'PY'
          import subprocess
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(n.startswith('MARSAM/')for n in names if n)
          PY
          git config user.name 'Onour Impram'
          git config user.email '215815131+OnourImpram@users.noreply.github.com'
          git commit -m 'build: stage MARSAM 0.5 editorial design without changing Elif or the personal site'
          git push origin HEAD:publish/marsam-editorial-05
          git rev-parse HEAD > .marsam-source/verification/editorial-candidate-sha.txt
          git rev-parse HEAD:MARSAM > .marsam-source/verification/editorial-candidate-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-editorial-staged
          path: .marsam-source/verification/
          retention-days: 7
  verify-public:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OnourImpram/MARSAM
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare route manifest and actual browser
        run: |
          npm run build
          python -m pip install -q playwright==1.57.0
          python -m playwright install chromium
      - name: Wait for explicit promotion of the reviewed candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          for i in {1..120}; do
            if curl -fsS --max-time 12 "https://onourimpram.github.io/MARSAM/release.json?source=$SOURCE_COMMIT" > /tmp/marsam-release.json; then
              if python -c "import json,os;assert json.load(open('/tmp/marsam-release.json'))['sourceCommit']==os.environ['SOURCE_COMMIT']"; then
                cp /tmp/marsam-release.json verification/editorial-public-release.json
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'Exact candidate is not public. Do not claim publication.' >&2
          exit 1
      - name: Verify the bytes actually served by GitHub Pages
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import urlopen,Request
          from pathlib import Path
          import json,hashlib,time
          m=json.load(open('verification/editorial-public-release.json'));root=m['url']
          def check(item):
              name,meta=item
              for attempt in range(3):
                  try:
                      with urlopen(Request(root+name,headers={'User-Agent':'MARSAM-design-verification'}),timeout=25) as r:data=r.read();assert r.status==200
                      assert hashlib.sha256(data).hexdigest()==meta['sha256'],name
                      return {'path':name,'passed':True}
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2)
          with ThreadPoolExecutor(max_workers=8) as pool:results=list(pool.map(check,[(p,v)for p,v in m['files'].items()if p not in {'.nojekyll','_headers'}]))
          with urlopen('https://onourimpram.github.io/',timeout=25) as r:home=r.read()
          assert hashlib.sha1(b'blob '+str(len(home)).encode()+b'\0'+home).hexdigest()=='501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          Path('verification/editorial-public-bytes.json').write_text(json.dumps({'passed':True,'sourceCommit':m['sourceCommit'],'checked':len(results),'unchangedPersonalHomepage':True,'files':results},indent=2))
          print('Verified public files',len(results))
          PY
      - name: Exercise the actual published design in eight languages
        env:
          PREVIEW_ORIGIN: https://onourimpram.github.io
        run: python tests/design_e2e.py
      - name: Verify public search, persistent list and actual downloads
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          root='https://onourimpram.github.io/MARSAM/';checks=[]
          with sync_playwright() as p:
              b=p.chromium.launch();c=b.new_context(accept_downloads=True);page=c.new_page()
              page.goto(root+'tr/search/',wait_until='networkidle');page.locator('#page-search').fill('maneviyat');page.wait_for_selector('[data-search-results] .search-result');checks.append('public Turkish search')
              page.goto(root+'tr/dossier/theory-and-integration/',wait_until='networkidle');page.locator('[data-save]').click();page.reload(wait_until='networkidle');assert page.locator('[data-save]').get_attribute('aria-pressed')=='true';checks.append('persistent reading list')
              page.locator('[data-open-search]').click();assert page.locator('#global-search').evaluate('(e)=>e===document.activeElement');page.keyboard.press('Escape');assert not page.locator('dialog').is_visible();checks.append('keyboard search dialog')
              page.goto(root+'tr/resource/theories-book/',wait_until='networkidle')
              with page.expect_download() as ev:page.locator('a[download][href$=".ris"]').click()
              assert 'TY  - ' in Path(ev.value.path()).read_text();checks.append('native RIS download')
              c.close();b.close()
          Path('verification/editorial-public-core.json').write_text(json.dumps({'passed':True,'url':root,'checks':checks},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-editorial-live-evidence
          path: |
            verification/editorial*
            .browser-results/editorial/
          include-hidden-files: true
          retention-days: 7

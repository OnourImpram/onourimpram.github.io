name: Elif V23 live verification
# hydration-safe mobile rerun
on:
  push:
    branches: [elif-v23-premium-finish-20260930]
    paths: ['.github/workflows/elif-v23-live.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elif-v23-premium-finish-20260930
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild exact approved V23 source
        working-directory: elif-tasarim/source-v12
        run: |
          set -euo pipefail
          mkdir -p evidence/v23-live
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee evidence/v23-live/build.txt
          npm test | tee evidence/v23-live/unit.txt
          npm run typecheck:core | tee evidence/v23-live/types.txt
          npm run verify:dist | tee evidence/v23-live/integrity.txt
      - name: Wait for GitHub Pages V23
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if curl -fsS https://onourimpram.github.io/elif-tasarim/release-v23.json >/tmp/release-v23.json; then
              echo "V23 manifest is live"
              exit 0
            fi
            sleep 5
          done
          echo "V23 manifest did not become live in time" >&2
          exit 1
      - name: Verify every live file and direct route
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/v23-live/public
        run: python tests/v11/public_verify.py
      - name: Install Chromium tooling
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Exercise Devir visibility and all canonical content on live site
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/v23-live/desktop
        run: xvfb-run -a python tests/v23/browser.py
      - name: Sweep every canonical route on live mobile viewport
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/v23-live/mobile
        run: xvfb-run -a python tests/v23/mobile-media.py
      - name: Preserve live handoff and full 360 behavior
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/v23-live/handoff xvfb-run -a python tests/v22/acceptance.py
          EVIDENCE_DIR=evidence/v23-live/orbit xvfb-run -a python tests/v12/acceptance.py
      - name: Confirm personal homepage stayed untouched
        run: test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v23-live-evidence
          path: elif-tasarim/source-v12/evidence/v23-live
          retention-days: 14

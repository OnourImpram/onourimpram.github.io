name: Publish and verify MARSAM on existing Pages
on:
  push:
    branches: [publish/marsam-review-20261001]
    paths: [.github/workflows/marsam-publish.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: marsam-review-publication
  cancel-in-progress: false
env:
  SOURCE_COMMIT: 3fbce07da07e68b08d443d2643ff09be7f1fb0e2
  BASE_PATH: /MARSAM/
  PAGES_PREVIEW: 'true'
jobs:
  stage:
    if: github.repository == 'OnourImpram/onourimpram.github.io' && github.ref == 'refs/heads/publish/marsam-review-20261001'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      candidate: ${{ steps.candidate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/checkout@v4
        with:
          repository: OnourImpram/MARSAM
          ref: ${{ env.SOURCE_COMMIT }}
          path: .marsam-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify unchanged reviewed source at root and Pages path
        working-directory: .marsam-source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          mkdir -p verification
          BASE_PATH=/ npm run check | tee verification/final-root.log
          npm run check | tee verification/final-pages.log
      - name: Install verification browser only
        run: python -m pip install playwright==1.57.0 && python -m playwright install --with-deps chromium
      - name: Test every existing interaction before staging
        working-directory: .marsam-source
        run: |
          python tests/browser_e2e.py
          python tests/campus_e2e.py
      - name: Stage only generated public website under MARSAM
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          source=Path('.marsam-source/dist');target=Path('MARSAM')
          assert not target.exists(), 'Existing MARSAM directory requires reconciliation'
          m=json.loads((source/'build-manifest.json').read_text())
          assert m['base']=='/MARSAM/' and m['mode']=='preview'
          assert m['previewDeploymentAuthorized'] is True and m['publicationAuthorized'] is False
          assert m['institution']['formalApprovalVerified'] is False
          m['deploymentCommit']=os.environ['SOURCE_COMMIT']
          m['deploymentHost']='OnourImpram/onourimpram.github.io'
          (source/'build-manifest.json').write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n')
          allowed={'.html','.css','.js','.json','.svg','.png','.txt','.ris','.bib'}
          files={}
          for f in sorted(source.rglob('*')):
              if f.is_file():
                  assert not f.is_symlink()
                  assert f.suffix in allowed or f.name in {'.nojekyll','_headers'},f
                  files[f.relative_to(source).as_posix()]={'sha256':hashlib.sha256(f.read_bytes()).hexdigest(),'bytes':f.stat().st_size}
          release={'release':'marsam-review-0.3.0','sourceCommit':os.environ['SOURCE_COMMIT'],'url':'https://onourimpram.github.io/MARSAM/','mode':'institutional-review','formalApproval':False,'files':files}
          (source/'release.json').write_text(json.dumps(release,ensure_ascii=False,indent=2)+'\n')
          shutil.copytree(source,target)
          print('Public site files:',len(files)+1)
          PY
      - name: Commit isolated candidate, never publish unrelated files
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -- MARSAM
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(p.startswith('MARSAM/') for p in paths if p)
          assert len([p for p in paths if p])>440
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: stage verified MARSAM review site without changing existing sites'
          test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          git push origin HEAD:refs/heads/publish/marsam-review-20261001
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > .marsam-source/verification/candidate-commit.txt
          git rev-parse HEAD:MARSAM > .marsam-source/verification/marsam-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-staging-verification
          path: .marsam-source/verification/
          retention-days: 14
  verify-public:
    needs: stage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OnourImpram/MARSAM
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for explicit promotion through the connected GitHub publisher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          for i in {1..120}; do
            if curl -fsS --max-time 15 "https://onourimpram.github.io/MARSAM/release.json?source=$SOURCE_COMMIT" > /tmp/marsam-release.json; then
              if python -c "import json,os;assert json.load(open('/tmp/marsam-release.json'))['sourceCommit']==os.environ['SOURCE_COMMIT']"; then
                cp /tmp/marsam-release.json verification/public-release.json
                exit 0
              fi
            fi
            sleep 5
          done
          echo 'The candidate was not publicly promoted. No live-site claim is permitted.' >&2
          exit 1
      - name: Verify all public bytes and preserve unrelated homepage
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import urlopen,Request
          import json,hashlib,time
          from pathlib import Path
          m=json.load(open('verification/public-release.json'))
          root=m['url'];results=[]
          def check(item):
              path,meta=item
              for attempt in range(3):
                  try:
                      with urlopen(Request(root+path,headers={'User-Agent':'MARSAM-publication-verification'}),timeout=30) as r:
                          body=r.read();assert r.status==200
                      assert hashlib.sha256(body).hexdigest()==meta['sha256'],path
                      return {'path':path,'pass':True,'bytes':len(body)}
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2)
          # GitHub may omit dotfiles and does not interpret Netlify-style _headers.
          items=[(p,v) for p,v in m['files'].items() if p not in {'.nojekyll','_headers'}]
          with ThreadPoolExecutor(max_workers=8) as pool:results=list(pool.map(check,items))
          with urlopen('https://onourimpram.github.io/',timeout=30) as r:home=r.read()
          assert hashlib.sha1(b'blob '+str(len(home)).encode()+b'\0'+home).hexdigest()=='501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          Path('verification/public-byte-checks.json').write_text(json.dumps({'url':root,'sourceCommit':m['sourceCommit'],'checked':len(results),'passed':True,'unrelatedHomepageUnchanged':True,'files':results},indent=2))
          print('Verified exact public files:',len(results))
          PY
      - name: Prepare existing browser tests for real public origin
        run: |
          npm run build
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Exercise all enhanced interactions on the actual github.io site
        env:
          PREVIEW_ORIGIN: https://onourimpram.github.io
        run: python tests/campus_e2e.py
      - name: Verify public search, reading list and native download
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          from pathlib import Path
          import json
          root='https://onourimpram.github.io/MARSAM/'
          checks=[]
          with sync_playwright() as p:
              b=p.chromium.launch();c=b.new_context(accept_downloads=True);page=c.new_page()
              page.goto(root+'tr/search/',wait_until='networkidle')
              page.locator('#page-search').fill('maneviyat');page.wait_for_selector('[data-search-results] .search-result')
              checks.append('live Turkish search')
              page.goto(root+'tr/dossier/preferences-and-boundaries/',wait_until='networkidle')
              page.locator('[data-save]').click();page.reload(wait_until='networkidle')
              assert page.locator('[data-save]').get_attribute('aria-pressed')=='true';checks.append('persistent reading list')
              page.locator('[data-open-search]').click();assert page.locator('#global-search').evaluate('(e)=>e===document.activeElement')
              page.keyboard.press('Escape');assert not page.locator('dialog').is_visible();checks.append('keyboard search dialog')
              page.goto(root+'tr/contribute/',wait_until='networkidle')
              page.locator('#draft-title').fill('Public source proposal')
              page.locator('#draft-url').fill('https://doi.org/10.1037/amp0000821')
              page.locator('#draft-note').fill('Bibliographic suggestion. No participant data.')
              page.locator('#draft-confirm').check()
              with page.expect_download() as ev:page.locator('[data-requires-js]').click()
              assert json.loads(Path(ev.value.path()).read_text())['submission']=='not-sent';checks.append('native local-only JSON download')
              c.close();b.close()
          Path('verification/public-core-flows.json').write_text(json.dumps({'passed':True,'url':root,'checks':checks},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-live-publication-evidence
          path: |
            verification/
            .browser-results/campus/
          retention-days: 14

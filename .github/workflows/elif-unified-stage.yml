name: Elif unified studio stage
on:
  push:
    branches: [elif-v23-unified-studio-20261001]
    paths: ['.github/workflows/elif-unified-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elif-v23-unified-studio-20261001
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import exact locally tested source delta
        env:
          PATCH_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-e5a8-820a-8dc0-4b2530ee3758/raw?se=2026-10-01T09%3A51%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=2b8add1f-eb86-5ee4-a0c6-a50ff842873b&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T06%3A49%3A26Z&ske=2026-10-02T06%3A49%3A26Z&sks=b&skv=2026-02-06&sig=4wAc%2B5Ki4RdA7i095nZXQZQvdC1SENhgcu0vA7oU/Bk%3D'
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,urllib.request,io,zipfile,json
          raw=urllib.request.urlopen(urllib.request.Request(__import__('os').environ['PATCH_URL'],headers={'User-Agent':'Mozilla/5.0','Accept':'application/octet-stream'}),timeout=40).read()
          assert hashlib.sha256(raw).hexdigest()=='fd113f125212583a0fa105a0018ebf801a59d2aea4290c1639fec151739d3b18'
          archive=zipfile.ZipFile(io.BytesIO(raw));delta=json.loads(archive.read('delta.json'))
          assert delta['base']=='673d874943b5de26255e5ce6980437b388e7f3b9'
          root=Path('elif-tasarim/source-v12').resolve()
          pending=[]
          for item in delta['files']:
            rel=Path(item['path']);assert not rel.is_absolute() and '..' not in rel.parts
            target=root/rel
            assert target.resolve().is_relative_to(root)
            before=target.read_bytes() if target.exists() else None
            current=hashlib.sha256(before).hexdigest() if before is not None else None
            assert current==item['before'],(item['path'],current,item['before'])
            body=archive.read('files/'+item['path']) if item['after'] is not None else None
            assert body is None or hashlib.sha256(body).hexdigest()==item['after']
            pending.append((target,body))
          for target,body in pending:
            if body is None:target.unlink()
            else:target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(body)
          audit=json.loads((root/'docs/v23-unified/ARCHIVE_AUDIT.json').read_text())
          assert audit['uniquePhotos']==26
          for item in audit['sources']:
            assert hashlib.sha256((root/'public/assets'/item['publishedFile']).read_bytes()).hexdigest()==item['publishedSHA256']
          print('Applied source changes',len(pending),'archive images verified',len(audit['sources']))
          PY
      - name: Commit isolated implementation only
        run: |
          set -euo pipefail
          git add -A elif-tasarim/source-v12
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(elif): one 3D studio, query-safe legacy redirect, full user portfolio and honest readiness'
          git push origin HEAD:elif-v23-unified-studio-20261001
      - name: Deterministic build and full source verification
        working-directory: elif-tasarim/source-v12
        run: |
          set -euo pipefail
          mkdir -p evidence/v23-unified-stage
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee evidence/v23-unified-stage/build.txt
          npm test | tee evidence/v23-unified-stage/unit.txt
          npm run typecheck:core | tee evidence/v23-unified-stage/types.txt
          npm run verify:dist | tee evidence/v23-unified-stage/integrity.txt
      - name: Install Chromium tooling
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Serve candidate at its real subpath
        working-directory: elif-tasarim/source-v12
        run: |
          node tools/serve-static.cjs dist 8000 > /tmp/elif-stage-server.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:8000/elif-tasarim/release-v23.json && break; sleep 1; done
      - name: Validate single studio, all archive photos, legacy links and desktop pages
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
          EVIDENCE_DIR: evidence/v23-unified-stage/unified
        run: xvfb-run -a python tests/v23-unified/browser.py
      - name: All canonical pages and media on mobile
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
          EVIDENCE_DIR: evidence/v23-unified-stage/mobile
        run: xvfb-run -a python tests/v23/mobile-media.py
      - name: Preserve contact, full 360 and actual exports
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/v23-unified-stage/contact xvfb-run -a python tests/v22/acceptance.py
          EVIDENCE_DIR=evidence/v23-unified-stage/orbit xvfb-run -a python tests/v12/acceptance.py
          EVIDENCE_DIR=evidence/v23-unified-stage/exports xvfb-run -a python tests/v20/acceptance.py
      - name: Confirm unrelated personal homepage is untouched
        run: test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-unified-stage-evidence
          path: elif-tasarim/source-v12/evidence/v23-unified-stage
          retention-days: 14

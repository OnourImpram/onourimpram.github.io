name: Elif V20 live release verification
on:
  push:
    branches: [elif-v20-final-20260926]
    paths: ['.github/workflows/elif-v20-live.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cc44c9eb1679ec9c66cac6e72514fc835249ef14
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild the exact approved publication
        working-directory: elif-tasarim/source-v12
        run: |
          set -euo pipefail
          mkdir -p evidence/v20-live
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee evidence/v20-live/build.txt
          cmp dist/release-v20.json ../release-v20.json
          npm run verify:dist
      - name: Verify all actual public files and direct page URLs
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/v20-live/public
        run: python tests/v11/public_verify.py
      - name: Install isolated Chromium tooling
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Exercise real V20 model exports and preserved customer journeys
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/v20-live/features xvfb-run -a python tests/v20/acceptance.py | tee evidence/v20-live/features.txt
          EVIDENCE_DIR=evidence/v20-live/decisions xvfb-run -a python tests/v11/acceptance.py | tee evidence/v20-live/decisions.txt
          EVIDENCE_DIR=evidence/v20-live/cplus xvfb-run -a python tests/v12/acceptance.py | tee evidence/v20-live/cplus.txt
          EVIDENCE_DIR=evidence/v20-live/responsive xvfb-run -a python tests/v11/matrix.py | tee evidence/v20-live/responsive.txt
      - name: Confirm personal root homepage has not changed
        run: test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v20-live-evidence
          path: elif-tasarim/source-v12/evidence/v20-live
          retention-days: 14

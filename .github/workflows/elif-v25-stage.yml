name: Elif V25 staging and verification
on:
  push:
    branches: [elif-v25-stage-20261002]
    paths: [.github/workflows/elif-v25-stage.yml]
permissions:
  contents: write
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: http://127.0.0.1:8000/elif-tasarim/
      EVIDENCE_ROOT: /tmp/elif-v25-evidence
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elif-v25-stage-20261002
      - name: Receive exact reviewed public source
        env:
          PAYLOAD_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-24b0-820a-9ee4-8bcc93e2b621/raw?se=2026-10-02T06%3A00%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=353645fc-ba5d-5f05-8f4b-b6139fd3b85d&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T05%3A36%3A15Z&ske=2026-10-03T05%3A36%3A15Z&sks=b&skv=2026-02-06&sig=92kzHpL1ba6NpYKevLlMFU0iqml8kTPV4nLz0Ig6rlM%3D'
        run: |
          echo "::add-mask::$PAYLOAD_URL"
          test "$(git rev-parse HEAD:elif-tasarim)" = 72082b4f9bb039a31d511a26bdb4fd3ad605b540
          mkdir -p /tmp/elif-v25-payload "$EVIDENCE_ROOT"
          curl --fail --silent --show-error --location "$PAYLOAD_URL" -o /tmp/elif-v25-payload.zip
          echo '9f6738dab8f58102cdadf5fdfc3853157ff45e60f8dfb13e2eb9f2be5f7743a7  /tmp/elif-v25-payload.zip' | sha256sum --check
          python - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('/tmp/elif-v25-payload.zip') as z:
              for n in z.namelist():
                  p=pathlib.PurePosixPath(n)
                  assert not p.is_absolute() and '..' not in p.parts and p.parts[0]=='source',n
              z.extractall('/tmp/elif-v25-payload')
          PY
          rsync -a --delete /tmp/elif-v25-payload/source/ elif-tasarim/source-v12/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned test dependencies
        run: |
          cd elif-tasarim/source-v12
          npm ci
          pip install playwright==1.55.0 beautifulsoup4==4.13.5
          python -m playwright install --with-deps chromium
      - name: Build, strict core types, full unit suite and static audit
        run: |
          set -o pipefail
          cd elif-tasarim/source-v12
          npm run build | tee "$EVIDENCE_ROOT/build.log"
          npm run typecheck:core | tee "$EVIDENCE_ROOT/typecheck.log"
          npm test | tee "$EVIDENCE_ROOT/unit.log"
          npm run verify:dist | tee "$EVIDENCE_ROOT/integrity.log"
          EVIDENCE_DIR="$EVIDENCE_ROOT/static" python tests/v25/site-audit.py
      - name: Start isolated HTTP server
        run: |
          cd elif-tasarim/source-v12
          nohup node tools/serve-static.cjs dist 8000 > "$EVIDENCE_ROOT/server.log" 2>&1 &
          for i in $(seq 1 30); do curl -fsS "$BASE_URL/release-v25.json" >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Browser, mobile, gallery, project, carousel and 3D regressions
        run: |
          cd elif-tasarim/source-v12
          failed=0
          for test in v25/browser seo/browser seo/hero-browser v22/acceptance v23-unified/browser v23-interaction/browser v23/mobile-media; do
            name="${test//\//-}"
            mkdir -p "$EVIDENCE_ROOT/$name"
            if EVIDENCE_DIR="$EVIDENCE_ROOT/$name" timeout 240 python "tests/$test.py" > "$EVIDENCE_ROOT/$name/run.log" 2>&1; then
              echo "PASS $test"
            else
              echo "FAIL $test"
              cat "$EVIDENCE_ROOT/$name/run.log"
              failed=1
            fi
          done
          exit "$failed"
      - name: Stage verified candidate, never publish main automatically
        run: |
          set -e
          rsync -a --delete --exclude=/source-v12/ elif-tasarim/source-v12/dist/ elif-tasarim/
          git add -A -- elif-tasarim
          test -z "$(git diff --cached --name-only | grep -v '^elif-tasarim/' || true)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Elif V25 candidate: eight bed concepts, sixteen views, full regression checks'
          git push origin HEAD:elif-v25-stage-20261002
          git rev-parse HEAD > "$EVIDENCE_ROOT/candidate-commit.txt"
          git rev-parse HEAD:elif-tasarim > "$EVIDENCE_ROOT/candidate-elif-tree.txt"
          git ls-tree HEAD > "$EVIDENCE_ROOT/candidate-root-tree.txt"
          git diff --stat HEAD~1 HEAD -- elif-tasarim > "$EVIDENCE_ROOT/change-stat.txt"
          git archive HEAD elif-tasarim | gzip > "$EVIDENCE_ROOT/Elif_V25_Candidate.tar.gz"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v25-candidate-evidence
          path: /tmp/elif-v25-evidence/
          retention-days: 14

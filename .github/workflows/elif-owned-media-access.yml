name: Elif owned image access
on:
  push:
    branches: [elif-v23-unified-studio-20261001]
    paths: ['.github/workflows/elif-owned-media-access.yml']
permissions:
  contents: read
jobs:
  access:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read owned image rendition without changing asset
        run: |
          python - <<'PY'
          import urllib.request,json
          from pathlib import Path
          base='https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F49104234-ec8e-42d7-b5bf-eb2b93dddfce/watermark:F/width:150?csig=AAAAAAAAAAAAAAAAAAAAAFnVeC2N98iCov1z-iVsMTq2ACGJje92Zl7fEKG7iMTj&exp=1790860787&osig=AAAAAAAAAAAAAAAAAAAAAK8latEmwDjTmeYMgMz8GchQaumBpeWA3j1-ZNH5JYJd&signer=media-rpc&x-canva-quality=thumbnail'
          results=[]
          for label,url in [('provided',base),('full',base.replace('height:200','height:1440').replace('width:150','width:1080').replace('quality:75','quality:85'))]:
            try:
              response=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=25)
              data=response.read();Path(label+'.jpg').write_bytes(data);results.append({'name':label,'status':response.status,'bytes':len(data)})
            except Exception as e:results.append({'name':label,'error':str(e)})
          Path('media-access.json').write_text(json.dumps(results));print(results)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: elif-owned-media-access
          path: |
            *.jpg
            media-access.json
          retention-days: 7

name: Elif V7 public verification
on:
  push:
    branches: [elif-tasarim-v7-release-20260924]
    paths: ['.github/workflows/elif-v7-live.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Wait for the exact approved V7 manifest on GitHub Pages
        run: |
          python - <<'PY'
          import subprocess,hashlib,time
          expected='22ae7133e89a89873d6cb137d811e2fc0b2d57cf0f5b3963469d1f397db75f3b'
          for attempt in range(30):
            p=subprocess.run(['curl','--fail','--silent','--show-error','--max-time','15','https://onourimpram.github.io/elif-tasarim/release-v7.json'],capture_output=True)
            if p.returncode==0 and hashlib.sha256(p.stdout).hexdigest()==expected:
              print('Exact approved V7 manifest reached public Pages endpoint.');break
            time.sleep(5)
          else:raise SystemExit('V7 publication not confirmed. No success claimed.')
          PY
      - name: Install isolated Chromium tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Public file integrity, real routes, correct contact and customer flows
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: elif-v7-release/live-evidence
        run: python elif-v7-release/verify.py
      - name: Verify the personal homepage was not changed
        run: |
          test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v7-public-verification
          path: elif-v7-release/live-evidence
          retention-days: 14

name: Elif V23 premium finish stage
on:
  push:
    branches: [elif-v23-premium-finish-20260929]
    paths: ['.github/workflows/elif-v23-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean build and source regressions
        working-directory: elif-tasarim/source-v12
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm test
          npm run typecheck:core
          npm run verify:dist
          npm run launch:check
      - name: Install isolated Chromium tools
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Serve only the generated V23 publication
        working-directory: elif-tasarim/source-v12
        run: |
          node tools/serve-static.cjs dist 8000 >/tmp/elif-v23-server.log 2>&1 &
          echo $! >/tmp/elif-v23-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/elif-tasarim/release-v23.json >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/elif-tasarim/release-v23.json >/dev/null
      - name: Verify Devir completeness, customer paths, 360 degree studio and responsive matrix
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/v23/premium xvfb-run -a python tests/v23/acceptance.py
          EVIDENCE_DIR=evidence/v23/contact xvfb-run -a python tests/v22/acceptance.py
          EVIDENCE_DIR=evidence/v23/product xvfb-run -a python tests/v20/acceptance.py
          EVIDENCE_DIR=evidence/v23/decision xvfb-run -a python tests/v11/acceptance.py
          EVIDENCE_DIR=evidence/v23/orbit xvfb-run -a python tests/v12/acceptance.py
          EVIDENCE_DIR=evidence/v23/matrix xvfb-run -a python tests/v23/matrix.py
      - name: Preserve personal homepage
        run: test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - name: Replace only the Elif public release with tested V23 dist
        shell: python
        run: |
          from pathlib import Path
          import json,shutil
          root=Path('elif-tasarim');dist=root/'source-v12'/'dist'
          old=root/'release-v22.json'
          if old.exists():
              manifest=json.loads(old.read_text())
              for name in manifest.get('files',{}):
                  p=root/name
                  if p.is_file():p.unlink()
              old.unlink()
          for p in dist.rglob('*'):
              if p.is_file():
                  target=root/p.relative_to(dist);target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,target)
          assert (root/'release-v23.json').exists()
      - name: Commit exact tested V23 publication to staging branch
        run: |
          set -euo pipefail
          git config user.name "Onour Impram"
          git config user.email "onuribram@outlook.com"
          git add -A elif-tasarim
          if ! git diff --cached --quiet; then
            git commit -m "release(elif): stage verified V23 premium finish"
            git push origin HEAD:elif-v23-premium-finish-20260929
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v23-stage-evidence
          path: elif-tasarim/source-v12/evidence/v23
          retention-days: 14

name: Elif V8 final Three acceptance
on:
  push:
    branches: [elif-v8-three-studio-20260924]
    paths: ['.github/workflows/elif-v8-final-stage.yml']
permissions:
  contents: write
  actions: read
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: elif-v8-refined-studio
          run-id: 36035206591
          github-token: ${{ github.token }}
          path: elif-v8-work
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Correct activation accessible name from reproduced locator failure
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('elif-v8-work/src/components/DeskExperience.tsx')
          s=p.read_text()
          assert '<span className="v8-cube">◇</span>' in s
          s=s.replace('<span className="v8-cube">◇</span>','<span className="v8-cube" aria-hidden="true">◇</span>')
          s=s.replace('<button type="button" onClick={this.start}>','<button type="button" aria-label="3D deneyimi başlat" onClick={this.start}>')
          p.write_text(s)
          PY
      - name: Verify pinned clean build
        run: |
          set -euo pipefail
          cd elif-v8-work
          npm ci --ignore-scripts --no-audit --no-fund
          npm test | tee evidence/v8/unit-final.txt
      - name: Install real WebGL test environment
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Run all Three.js, customer handoff and mobile checks
        run: |
          set -euo pipefail
          mkdir /tmp/elif-v8-http
          ln -s "$PWD/elif-v8-work/dist" /tmp/elif-v8-http/elif-tasarim
          python -m http.server 8080 --bind 127.0.0.1 --directory /tmp/elif-v8-http >/tmp/elif-http.log 2>&1 &
          sleep 1
          cd elif-v8-work
          WRITE_POSTERS=1 python tests/v8/browser.py 2>&1 | tee evidence/v8/browser-final.txt
          cp public/assets/devir-poster.webp public/assets/office-v8.webp
          cp public/assets/devir-poster.webp public/assets/office.webp
          npm run build
          npm run verify:dist
      - name: Preserve verified output on the isolated V8 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          rm -rf elif-tasarim
          cp -a elif-v8-work/dist elif-tasarim
          mkdir -p elif-tasarim/source-v8
          cp -a elif-v8-work/src elif-v8-work/tools elif-v8-work/tests elif-v8-work/docs elif-v8-work/public elif-tasarim/source-v8/
          cp elif-v8-work/package.json elif-v8-work/package-lock.json elif-tasarim/source-v8/
          cp elif-v8-work/docs/V8_README.md elif-tasarim/source-v8/README.md
          git add elif-tasarim
          git config user.name 'Elif Preview Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(elif): verified V8 Three.js concept desk and high resolution model renders'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:elif-v8-three-studio-20260924
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v8-final-studio
          path: |
            elif-v8-work/dist
            elif-v8-work/evidence
            elif-v8-work/src
            elif-v8-work/tools
            elif-v8-work/public
            elif-v8-work/tests
            elif-v8-work/docs
            elif-v8-work/package.json
            elif-v8-work/package-lock.json
          retention-days: 14

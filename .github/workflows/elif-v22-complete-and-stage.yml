name: Elif V22 final email and UX gates
on:
  push:
    branches: [elif-v22-ux-mail-final-20260927]
    paths: ['.github/workflows/elif-v22-complete-and-stage.yml']
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-verified recovered source changes within Elif only
        shell: python
        run: |
          from pathlib import Path
          import json,base64,zlib,hashlib
          parts=['01','02','03','04','05a','05b','05c','05d','06']
          text=''.join(Path('elif-v22-tools/final-patch-'+p+'.b64').read_text().strip() for p in parts)
          assert len(text)==33076,('encoded length',len(text))
          raw=zlib.decompress(base64.b64decode(text,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='34f396d57598fd15eb4da69f10e94df0516d923f93cc2a13c3b5dcfd8a7c67d7'
          data=json.loads(raw)
          assert data['base']=='c6d3561958069448f2c929e421bc987fede3b50a' and len(data['files'])==38
          root=Path('elif-tasarim/source-v12')
          prepared=[]
          for item in data['files']:
              rel=Path(item['path']);assert not rel.is_absolute() and '..' not in rel.parts
              target=root/rel
              if item['before'] is None:
                  assert not target.exists(),str(target)
                  result=item['content']
              else:
                  old=target.read_bytes();assert hashlib.sha256(old).hexdigest()==item['before'],str(target)
                  result=old.decode()
                  for start,end,value in reversed(item['edits']):
                      assert 0<=start<=end<=len(result)
                      result=result[:start]+value+result[end:]
              content=result.encode();assert hashlib.sha256(content).hexdigest()==item['sha256'],str(target)
              prepared.append((target,content))
          for target,content in prepared:
              target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(content)
          print('Applied and verified',len(prepared),'source files')
      - name: Build, unit regressions, core types and exact file integrity
        working-directory: elif-tasarim/source-v12
        run: |
          set -euo pipefail
          mkdir -p evidence/v22-final
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee evidence/v22-final/build.txt
          npm test | tee evidence/v22-final/unit.txt
          npm run typecheck:core | tee evidence/v22-final/types.txt
          npm run verify:dist | tee evidence/v22-final/integrity.txt
          npm run launch:check | tee evidence/v22-final/launch.txt
      - name: Install isolated Chromium browser tooling
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Serve only the generated release
        working-directory: elif-tasarim/source-v12
        run: |
          node tools/serve-static.cjs dist 8000 > /tmp/elif-v22.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/elif-tasarim/release-v22.json >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/elif-tasarim/release-v22.json >/dev/null
      - name: Verify new email, handoff, clipboard fallback, inspiration and no-JavaScript paths
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
          EVIDENCE_DIR: evidence/v22-final/customer
        run: |
          set -euo pipefail
          xvfb-run -a python tests/v22/acceptance.py | tee evidence/v22-final/customer.txt
      - name: Preserve draft recovery, actual exports, customer decisions and full 360 orbit
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/v22-final/recovery xvfb-run -a python tests/v21/acceptance.py | tee evidence/v22-final/recovery.txt
          EVIDENCE_DIR=evidence/v22-final/exports xvfb-run -a python tests/v20/acceptance.py | tee evidence/v22-final/exports.txt
          EVIDENCE_DIR=evidence/v22-final/decisions xvfb-run -a python tests/v11/acceptance.py | tee evidence/v22-final/decisions.txt
          EVIDENCE_DIR=evidence/v22-final/orbit xvfb-run -a python tests/v12/acceptance.py | tee evidence/v22-final/orbit.txt
          EVIDENCE_DIR=evidence/v22-final/matrix xvfb-run -a python tests/v11/matrix.py | tee evidence/v22-final/matrix.txt
      - name: Preserve the personal homepage and stage verified Elif release
        shell: python
        run: |
          from pathlib import Path
          import subprocess,json,shutil
          assert subprocess.check_output(['git','hash-object','index.html'],text=True).strip()=='501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          root=Path('elif-tasarim');dist=root/'source-v12/dist'
          old=json.loads((root/'release-v21.json').read_text())
          for name in old['files']:
              rel=Path(name);assert not rel.is_absolute() and '..' not in rel.parts
              target=root/rel
              if target.is_file():target.unlink()
          (root/'release-v21.json').unlink()
          for source in dist.rglob('*'):
              if source.is_file():
                  target=root/source.relative_to(dist);target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(source,target)
          assert (root/'release-v22.json').exists()
      - name: Commit tested source and publication to the staging branch
        run: |
          set -euo pipefail
          git config user.name 'Onour Impram'
          git config user.email 'onuribram@outlook.com'
          git add -A elif-tasarim
          git commit -m 'release(elif): verified V22 contact, no-JS fallback and portable inspiration'
          git push origin HEAD:elif-v22-ux-mail-final-20260927
          git rev-parse HEAD > elif-tasarim/source-v12/evidence/v22-final/staged-commit.txt
      - name: Package exact source and publication without fonts
        shell: python
        run: |
          from pathlib import Path
          import zipfile,shutil
          root=Path('elif-tasarim');source=root/'source-v12';out=Path('v22-delivery');out.mkdir()
          excluded={'node_modules','.compiled','preview','dist','evidence','.git','__pycache__'};fonts={'.woff','.woff2','.ttf','.otf','.eot'}
          with zipfile.ZipFile(out/'Elif_Tasarim_V22_Kaynak_ve_Testler.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in source.rglob('*'):
                  if p.is_file() and not excluded.intersection(p.relative_to(source).parts) and p.suffix.lower() not in fonts:z.write(p,p.relative_to(source))
          with zipfile.ZipFile(out/'Elif_Tasarim_V22_Yayin_Dosyalari.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and 'source-v12' not in p.relative_to(root).parts and p.suffix.lower() not in fonts:z.write(p,Path('elif-tasarim')/p.relative_to(root))
          shutil.copy2(source/'preview/Elif_Tasarim.html',out/'Elif_Tasarim_V22.html')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v22-final-stage-evidence
          path: elif-tasarim/source-v12/evidence/v22-final
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: elif-v22-final-delivery
          path: v22-delivery
          retention-days: 14
          if-no-files-found: error

name: Elif V20 final verification and staging
on:
  push:
    branches: [elif-v20-final-20260926]
    paths: ['.github/workflows/elif-v20-finalize.yml']
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser and script tooling
        run: |
          python -m pip install PyYAML==6.0.2 playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Prepare hash-checked source and pinned exporter modules
        shell: python
        run: |
          import yaml,subprocess
          from pathlib import Path
          spec=yaml.safe_load(Path('.github/workflows/elif-v20-stage.yml').read_text())
          names=['Apply hash-verified local source delta within Elif only','Preserve pinned official exporter provenance']
          for name in names:
              matches=[s for s in spec['jobs']['stage']['steps'] if s.get('name')==name]
              assert len(matches)==1 and matches[0]['shell']=='python'
              subprocess.run(['python','-c',matches[0]['run']],check=True)
          subprocess.run(['python','elif-v20-tools/finalize.py'],check=True)
      - name: Clean build, unit regressions, strict core and byte integrity
        working-directory: elif-tasarim/source-v12
        run: |
          set -euo pipefail
          mkdir -p evidence/v20-final
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee evidence/v20-final/build.txt
          npm test | tee evidence/v20-final/unit.txt
          npm run typecheck:core | tee evidence/v20-final/types.txt
          npm run verify:dist | tee evidence/v20-final/integrity.txt
      - name: Serve generated V20
        working-directory: elif-tasarim/source-v12
        run: |
          node tools/serve-static.cjs dist 8000 > /tmp/elif-v20-final.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/elif-tasarim/release-v20.json >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/elif-tasarim/release-v20.json >/dev/null
      - name: Real GLB and USDZ, comparison, visual document and room diagram
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/v20-final/features xvfb-run -a python tests/v20/acceptance.py | tee evidence/v20-final/features.txt
      - name: Existing customer flows, true 360 orbit and responsive matrix
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/v20-final/decisions xvfb-run -a python tests/v11/acceptance.py | tee evidence/v20-final/decisions.txt
          EVIDENCE_DIR=evidence/v20-final/cplus xvfb-run -a python tests/v12/acceptance.py | tee evidence/v20-final/cplus.txt
          EVIDENCE_DIR=evidence/v20-final/responsive xvfb-run -a python tests/v11/matrix.py | tee evidence/v20-final/responsive.txt
      - name: Preserve personal homepage and stage only verified Elif files
        shell: python
        run: |
          from pathlib import Path
          import json,shutil,subprocess
          assert subprocess.check_output(['git','hash-object','index.html'],text=True).strip()=='501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          root=Path('elif-tasarim');dist=root/'source-v12/dist'
          old=json.loads((root/'release-v12.json').read_text())
          for name in old['files']:
              assert not Path(name).is_absolute() and '..' not in Path(name).parts
              p=root/name
              if p.is_file():p.unlink()
          (root/'release-v12.json').unlink()
          for p in dist.rglob('*'):
              if p.is_file():
                  target=root/p.relative_to(dist);target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,target)
          assert (root/'release-v20.json').exists()
      - name: Commit tested V20 to staging branch
        run: |
          set -euo pipefail
          git config user.name "Onour Impram"
          git config user.email "onuribram@outlook.com"
          git add -A elif-tasarim
          git commit -m "release(elif): verified V20 product studio, comparison and 3D exports"
          git push origin HEAD:elif-v20-final-20260926
          git rev-parse HEAD > elif-tasarim/source-v12/evidence/v20-final/staging-commit.txt
      - name: Package exact source and publication without fonts
        shell: python
        run: |
          from pathlib import Path
          import zipfile,shutil
          root=Path('elif-tasarim');source=root/'source-v12';out=Path('v20-delivery');out.mkdir()
          excluded={'node_modules','.compiled','preview','dist','evidence','.git'}
          fonts={'.woff','.woff2','.ttf','.otf','.eot'}
          with zipfile.ZipFile(out/'Elif_Tasarim_V20_Kaynak_ve_Testler.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in source.rglob('*'):
                  if p.is_file() and not excluded.intersection(p.relative_to(source).parts) and p.suffix.lower() not in fonts:z.write(p,p.relative_to(source))
          with zipfile.ZipFile(out/'Elif_Tasarim_V20_Yayin_Dosyalari.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and 'source-v12' not in p.relative_to(root).parts and p.suffix.lower() not in fonts:z.write(p,Path('elif-tasarim')/p.relative_to(root))
          shutil.copy2(source/'preview/Elif_Tasarim.html',out/'Elif_Tasarim_V20.html')
          shutil.copy2(source/'docs/V20_Teslim_Kapsami.md',out/'Elif_Tasarim_V20_Teslim_Kapsami.md')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v20-final-evidence
          path: elif-tasarim/source-v12/evidence/v20-final
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: elif-v20-final-delivery
          path: v20-delivery
          retention-days: 14

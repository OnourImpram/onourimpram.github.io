name: Elif V6 build and browser acceptance
on:
  push:
    branches: [elif-tasarim-v6-20260924]
    paths: ['elif-v6/build.cjs', '.github/workflows/elif-v6-build.yml']
permissions:
  contents: write
concurrency:
  group: elif-v6-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve selected publication assets and verify exact archive
        shell: python
        env:
          ASSET_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-2d74-81f5-baa2-a5c680eef921/raw?se=2026-09-24T11%3A18%3A49Z&sp=r&sv=2026-02-06&sr=b&scid=35c23478-c3c2-531e-9b9d-6e7f230cf846&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T07%3A52%3A10Z&ske=2026-09-25T07%3A52%3A10Z&sks=b&skv=2026-02-06&sig=/1L/EYy5T5ftZ8rRjxBJgTDjGVg2G3LQL16VV0wUknw%3D'
        run: |
          import os,urllib.request,hashlib,zipfile,io,pathlib
          with urllib.request.urlopen(os.environ['ASSET_URL'],timeout=45) as r: data=r.read(20000000)
          assert hashlib.sha256(data).hexdigest()=='5568387948089e607dd47ef4621dfa7711fdf295ec8e45b77294c32d84cd22ea'
          z=zipfile.ZipFile(io.BytesIO(data));assert len(z.infolist())<150 and sum(i.file_size for i in z.infolist())<30000000
          for i in z.infolist():
            p=pathlib.PurePosixPath(i.filename)
            assert not p.is_absolute() and '..' not in p.parts and p.parts[0]=='assets'
            assert not ((i.external_attr>>16)&0o170000)==0o120000
          z.extractall('elif-tasarim')
          print('Verified selected image archive',len(data),'bytes')
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source transport and rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install --prefix /tmp/elif-ts --ignore-scripts --no-audit --no-fund typescript@5.8.3
          NODE_PATH=/tmp/elif-ts/node_modules node elif-v6/build.cjs
          test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - name: Install isolated browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Run actual HTTP acceptance and optional Pinterest widget
        env:
          PREVIEW_URL: http://127.0.0.1:8080/elif-tasarim/
          EVIDENCE_DIR: elif-v6/evidence
        run: |
          python -m http.server 8080 --bind 127.0.0.1 >/tmp/elif-http.log 2>&1 &
          sleep 2
          python elif-v6/tests/v6/browser.py
          python elif-v6/tests/v6/pin-widget.py
      - name: Commit only verified Elif preview to isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p elif-tasarim/verification/v6
          cp elif-v6/evidence/*.json elif-tasarim/verification/v6/
          cp elif-v6/build.cjs elif-tasarim/source/build-v6.cjs
          cp elif-v6/payload.gz elif-tasarim/source/v6-payload.gz
          git config user.name 'Elif Preview Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elif-tasarim elif-v6/payload.gz elif-v6/tests
          git commit -m 'build(elif): tested V6 portfolio, model requests and high-resolution imagery'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:elif-tasarim-v6-20260924
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v6-preview-and-evidence
          path: |
            elif-tasarim
            elif-v6/evidence
          retention-days: 14

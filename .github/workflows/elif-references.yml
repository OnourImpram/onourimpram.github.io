name: Elif reference intelligence
on:
  push:
    branches: [elif-tasarim-preview-20260923]
    paths: ['elif-lab/**', '.github/workflows/elif-references.yml']
permissions:
  contents: read
jobs:
  public-reference-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Collect public evidence without submitting forms
        run: python elif-lab/capture.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-reference-evidence
          path: elif-lab/evidence
          retention-days: 7

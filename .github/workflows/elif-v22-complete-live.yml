name: Elif V22 completed live release and handoff
on:
  push:
    branches: [elif-v22-final-consistency-20260927]
    paths: ['.github/workflows/elif-v22-complete-live.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2bb3d7951f2b6b98ff3caf21052f0a5b7386efa2
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and retest the exact final source
        working-directory: elif-tasarim/source-v12
        run: |
          set -euo pipefail
          mkdir -p evidence/v22-completed
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee evidence/v22-completed/build.txt
          npm test | tee evidence/v22-completed/unit.txt
          npm run typecheck:core | tee evidence/v22-completed/types.txt
          npm run verify:dist | tee evidence/v22-completed/integrity.txt
          npm run launch:check | tee evidence/v22-completed/launch.txt
          cmp dist/release-v22.json ../release-v22.json
      - name: Verify all actual live files and direct page addresses
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/v22-completed/public
        run: python tests/v11/public_verify.py
      - name: Install isolated browser tooling
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Test live contact, recovery, exports, customer decisions and full orbit
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/v22-completed/customer xvfb-run -a python tests/v22/acceptance.py | tee evidence/v22-completed/customer.txt
          EVIDENCE_DIR=evidence/v22-completed/recovery xvfb-run -a python tests/v21/acceptance.py | tee evidence/v22-completed/recovery.txt
          EVIDENCE_DIR=evidence/v22-completed/exports xvfb-run -a python tests/v20/acceptance.py | tee evidence/v22-completed/exports.txt
          EVIDENCE_DIR=evidence/v22-completed/decisions xvfb-run -a python tests/v11/acceptance.py | tee evidence/v22-completed/decisions.txt
          EVIDENCE_DIR=evidence/v22-completed/orbit xvfb-run -a python tests/v12/acceptance.py | tee evidence/v22-completed/orbit.txt
          EVIDENCE_DIR=evidence/v22-completed/matrix xvfb-run -a python tests/v11/matrix.py | tee evidence/v22-completed/matrix.txt
      - name: Check the actual hydrated privacy page and preserve contact screenshots
        working-directory: elif-tasarim/source-v12
        shell: python
        run: |
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          out=Path('evidence/v22-completed/final-contact');out.mkdir(parents=True,exist_ok=True)
          base='https://onourimpram.github.io/elif-tasarim/'
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=b.new_page(viewport={'width':1440,'height':1100})
              errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto(base+'gizlilik/',wait_until='domcontentloaded',timeout=60000)
              page.wait_for_selector('#app .preview-bar')
              text=page.locator('#app').inner_text()
              assert 'Alıcı alanı, iletisim.eliftasarimatolyesi@gmail.com adresiyle hazırlanır.' in text
              assert 'İşletme e-postası doğrulanmadığı için alıcı boş bırakılır' not in text
              assert 'Bu site e-posta veya SMS teslimini doğrulamaz.' in text
              for route in ['iletisim','kolay-iletisim']:
                  page.goto(base+route+'/',wait_until='domcontentloaded',timeout=60000)
                  page.wait_for_selector('#app .preview-bar')
                  page.evaluate("async()=>{document.querySelectorAll('img').forEach(i=>i.loading='eager');await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})))}")
                  page.screenshot(path=str(out/(route+'-desktop.png')),full_page=True)
              assert not errors,errors
              (out/'privacy-consistency.json').write_text(json.dumps({'pass':True,'url':base+'gizlilik/','recipient':'iletisim.eliftasarimatolyesi@gmail.com','errors':errors,'messageSent':False},ensure_ascii=False,indent=2))
              b.close()
      - name: Confirm personal root homepage unchanged
        run: test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v22-completed-live-evidence
          path: elif-tasarim/source-v12/evidence/v22-completed
          retention-days: 14
      - name: Package the exact verified source and publication
        if: success()
        shell: python
        run: |
          from pathlib import Path
          import zipfile,shutil,hashlib,json
          source=Path('elif-tasarim/source-v12');dist=source/'dist';out=Path('v22-completed-delivery');out.mkdir()
          excluded={'node_modules','.compiled','preview','dist','evidence','.git','__pycache__'}
          fonts={'.woff','.woff2','.ttf','.otf','.eot'}
          with zipfile.ZipFile(out/'Elif_Tasarim_V22_Kaynak_ve_Testler.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(source.rglob('*')):
                  if p.is_file() and not excluded.intersection(p.relative_to(source).parts) and p.suffix.lower() not in fonts:
                      z.write(p,p.relative_to(source))
          with zipfile.ZipFile(out/'Elif_Tasarim_V22_Yayin_Dosyalari.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(dist.rglob('*')):
                  if p.is_file() and p.suffix.lower() not in fonts:
                      z.write(p,Path('elif-tasarim')/p.relative_to(dist))
          shutil.copy2(source/'preview/Elif_Tasarim.html',out/'Elif_Tasarim_V22.html')
          manifest={'productCommit':'2bb3d7951f2b6b98ff3caf21052f0a5b7386efa2','files':{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in out.iterdir() if p.is_file()}}
          (out/'delivery-hashes.json').write_text(json.dumps(manifest,indent=2))
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: elif-v22-completed-delivery
          path: v22-completed-delivery
          retention-days: 14

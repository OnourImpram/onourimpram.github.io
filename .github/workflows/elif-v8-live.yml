name: Elif V8 public Three verification
on:
  push:
    branches: [elif-v8-three-studio-20260924]
    paths: ['.github/workflows/elif-v8-live.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated real browser tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Verify public files, rendering, mechanics and customer journeys
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EXPECTED_DIR: elif-tasarim
        run: python elif-v8-tools/verify-live.py
      - name: Confirm the personal homepage remains unchanged
        run: |
          test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v8-public-evidence
          path: elif-v8-live-evidence
          retention-days: 14

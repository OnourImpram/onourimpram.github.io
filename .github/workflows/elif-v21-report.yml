name: Elif V21 report implementation gates
on:
  push:
    branches: [elif-v21-rapor-20260927]
    paths: ['.github/workflows/elif-v21-report.yml']
permissions:
  contents: write
jobs:
  review-and-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recover reviewed source only after checking every old and new hash
        run: python elif-v21-tools/apply.py
      - name: Build and run complete unit, privacy and publication contracts
        working-directory: elif-tasarim/source-v12
        run: |
          set -euo pipefail
          mkdir -p evidence/v21-stage
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee evidence/v21-stage/build.txt
          npm test | tee evidence/v21-stage/unit.txt
          npm run typecheck:core | tee evidence/v21-stage/types.txt
          npm run verify:dist | tee evidence/v21-stage/integrity.txt
          npm run launch:check | tee evidence/v21-stage/launch.txt
          set +e
          npm run launch:check -- --production > evidence/v21-stage/production-prerequisites.txt 2>&1
          result=$?
          set -e
          test "$result" = 1
          grep -q 'Production prerequisites are not complete' evidence/v21-stage/production-prerequisites.txt
      - name: Install isolated browser tools
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Serve generated V21 over real HTTP
        working-directory: elif-tasarim/source-v12
        run: |
          node tools/serve-static.cjs dist 8000 > /tmp/elif-v21-server.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:8000/elif-tasarim/release-v21.json >/dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:8000/elif-tasarim/release-v21.json >/dev/null
      - name: Consent, recovery, private file import, alternative contact and report pages
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
          EVIDENCE_DIR: evidence/v21-stage/report
        run: xvfb-run -a python tests/v21/acceptance.py
      - name: Preserve actual V20 exports and customer decisions
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/v21-stage/exports xvfb-run -a python tests/v20/acceptance.py | tee evidence/v21-stage/exports.txt
          EVIDENCE_DIR=evidence/v21-stage/decisions xvfb-run -a python tests/v11/acceptance.py | tee evidence/v21-stage/decisions.txt
          EVIDENCE_DIR=evidence/v21-stage/orbit xvfb-run -a python tests/v12/acceptance.py | tee evidence/v21-stage/orbit.txt
          EVIDENCE_DIR=evidence/v21-stage/matrix xvfb-run -a python tests/v11/matrix.py | tee evidence/v21-stage/matrix.txt
      - name: Optional Lighthouse laboratory diagnostics, not real-device certification
        continue-on-error: true
        working-directory: elif-tasarim/source-v12
        run: |
          set -euo pipefail
          mkdir -p evidence/v21-stage/lighthouse /tmp/elif-lighthouse
          npm install --prefix /tmp/elif-lighthouse --ignore-scripts --no-audit --no-fund lighthouse
          /tmp/elif-lighthouse/node_modules/.bin/lighthouse --version > evidence/v21-stage/lighthouse/version.txt
          export CHROME_PATH="$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')"
          for slug in home modelini-getir tasarim-masasi; do
            suffix="$slug/"; test "$slug" != home || suffix=""
            /tmp/elif-lighthouse/node_modules/.bin/lighthouse "http://127.0.0.1:8000/elif-tasarim/$suffix" --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --use-gl=angle --use-angle=swiftshader" --output=json --output-path="evidence/v21-stage/lighthouse/$slug.json" --only-categories=performance,accessibility,best-practices,seo --quiet
          done
      - name: Preserve personal homepage and stage verified Elif publication only
        shell: python
        run: |
          from pathlib import Path
          import json,shutil,subprocess
          assert subprocess.check_output(['git','hash-object','index.html'],text=True).strip()=='501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          root=Path('elif-tasarim');dist=root/'source-v12/dist'
          old=json.loads((root/'release-v20.json').read_text())
          for name in old['files']:
              p=Path(name);assert not p.is_absolute() and '..' not in p.parts and 'source-v12' not in p.parts
              target=root/p
              if target.is_file():target.unlink()
          (root/'release-v20.json').unlink()
          for p in dist.rglob('*'):
              if p.is_file():
                  target=root/p.relative_to(dist);target.parent.mkdir(parents=True,exist_ok=True);shutil.copy2(p,target)
          assert (root/'release-v21.json').exists()
      - name: Commit exact tested release to isolated staging branch
        run: |
          set -euo pipefail
          git config user.name "Onour Impram"
          git config user.email "onuribram@outlook.com"
          git add -A elif-tasarim
          git commit -m "release(elif): stage report-driven V21 trust and project continuity"
          git push origin HEAD:elif-v21-rapor-20260927
          git rev-parse HEAD > elif-tasarim/source-v12/evidence/v21-stage/staging-commit.txt
      - name: Package editable source, publication and portable preview without font files
        shell: python
        run: |
          from pathlib import Path
          import zipfile,shutil
          root=Path('elif-tasarim');source=root/'source-v12';out=Path('v21-delivery');out.mkdir(exist_ok=True)
          excluded={'node_modules','.compiled','preview','dist','evidence','.git'};fonts={'.woff','.woff2','.ttf','.otf','.eot'}
          with zipfile.ZipFile(out/'Elif_Tasarim_V21_Kaynak_ve_Testler.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in source.rglob('*'):
                  if p.is_file() and not excluded.intersection(p.relative_to(source).parts) and p.suffix.lower() not in fonts:z.write(p,p.relative_to(source))
          with zipfile.ZipFile(out/'Elif_Tasarim_V21_Yayin_Dosyalari.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in root.rglob('*'):
                  if p.is_file() and 'source-v12' not in p.relative_to(root).parts and p.suffix.lower() not in fonts:z.write(p,Path('elif-tasarim')/p.relative_to(root))
          shutil.copy2(source/'preview/Elif_Tasarim.html',out/'Elif_Tasarim_V21.html')
          for name in ['RAPOR_UYGULAMA_MATRISI.md','ISLETME_BILGILERI_VE_DEVIR.md','IMPLEMENTATION.md']:
              shutil.copy2(source/'docs/v21'/name,out/name)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v21-stage-evidence
          path: elif-tasarim/source-v12/evidence/v21-stage
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: elif-v21-delivery
          path: v21-delivery
          retention-days: 14

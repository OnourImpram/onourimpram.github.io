name: Elif single studio public verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/elif-studio-live.yml'
      - 'elif-tasarim/release-v23.json'
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: elif-tasarim/source-v12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact source and all application regressions
        run: |
          set -euo pipefail
          mkdir -p evidence/unified-live
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee evidence/unified-live/build.txt
          npm test | tee evidence/unified-live/unit.txt
          npm run typecheck:core | tee evidence/unified-live/types.txt
          npm run verify:dist | tee evidence/unified-live/integrity.txt
          cmp dist/release-v23.json ../release-v23.json
      - name: Wait for this exact release on GitHub Pages
        run: |
          set -euo pipefail
          for i in {1..60}; do
            curl -fsS "https://onourimpram.github.io/elif-tasarim/release-v23.json?verification=${GITHUB_RUN_ID}" -o /tmp/elif-public-manifest.json || true
            if cmp -s dist/release-v23.json /tmp/elif-public-manifest.json; then exit 0; fi
            sleep 5
          done
          echo 'The exact candidate manifest did not appear on the public site' >&2
          exit 1
      - name: Verify live hashes, canonical routes and unknown-route handling
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/unified-live/public
        run: python tests/v11/public_verify.py
      - name: Install browser tooling
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Actual studio, all archive images, legacy redirect and all desktop pages
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/unified-live/unified
        run: xvfb-run -a python tests/v23-unified/browser.py
      - name: Actual mobile pages and image loading
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/unified-live/mobile
        run: xvfb-run -a python tests/v23/mobile-media.py
      - name: Preserve real contact and 360-degree behavior
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/unified-live/contact xvfb-run -a python tests/v22/acceptance.py
          EVIDENCE_DIR=evidence/unified-live/orbit xvfb-run -a python tests/v12/acceptance.py
      - name: Paint and inspect real public content and deliberate failure recovery
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          import json
          BASE='https://onourimpram.github.io/elif-tasarim/'
          out=Path('evidence/unified-live/painted');out.mkdir(parents=True,exist_ok=True)
          result={'base':BASE,'checks':[],'limitations':['Isolated Chromium','No real message sent','No physical AR test']}
          def note(name):
            result['checks'].append({'name':name,'pass':True});(out/'results.json').write_text(json.dumps(result,ensure_ascii=False,indent=2))
          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,args=['--no-sandbox','--disable-dev-shm-usage','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
            context=browser.new_context(viewport={'width':1440,'height':1000},reduced_motion='reduce');page=context.new_page();errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
            def ready(path):
              page.goto(BASE+path,wait_until='domcontentloaded',timeout=60000);page.wait_for_selector('html[data-app-ready="true"]',timeout=30000)
            def capture(selector,name):
              block=page.locator(selector);block.scroll_into_view_if_needed()
              block.evaluate("async e=>{await Promise.all([...e.querySelectorAll('img')].map(i=>i.decode()));await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));}")
              page.wait_for_timeout(120);block.screenshot(path=str(out/name))
            ready('tasarim-masasi/');page.wait_for_selector('[data-three-status=ready]',timeout=120000)
            assert page.locator('main h1').count()==1 and page.get_by_role('navigation',name='Ana gezinme').get_by_role('link',name='3D Stüdyo',exact=True).count()==1
            assert page.locator('a[href*="/devir-01"]').count()==0
            capture('#studio-deneyimi','studio-desktop.png');capture('#studio-baslangic','presets-desktop.png');capture('#studio-detay','details-desktop.png')
            note('Studio, presets and detail are decoded within one canonical page')
            page.set_viewport_size({'width':390,'height':844});capture('#studio-baslangic','presets-mobile.png');assert page.evaluate('document.documentElement.scrollWidth<=innerWidth+1')
            ready('proje/ahsap-bahce-kamelyasi/');capture('.work-detail-media','pergola-gallery-mobile.png');note('Real multi-angle archive gallery is painted on mobile')
            page.set_viewport_size({'width':1440,'height':1000});ready('');capture('.v6-hero','home-desktop.png')
            assert not errors,errors;context.close()
            context=browser.new_context(viewport={'width':1280,'height':900});context.route('**/config.*.js',lambda route:route.abort());page=context.new_page();ready('tasarim-masasi/');page.wait_for_selector('.studio-preset-grid img',timeout=15000)
            assert page.locator('.missing-page').count()==0 and page.evaluate("window.__ELIF_BASE__==='/elif-tasarim'")
            page.wait_for_function("()=>[...document.querySelectorAll('.studio-guide img')].every(i=>i.complete&&i.naturalWidth>0)",timeout=15000)
            note('Blocked configuration recovers the real studio and all guide media from HTML');context.close()
            attempts=[];context=browser.new_context(viewport={'width':390,'height':844})
            def fail(route): attempts.append(route.request.url);route.abort()
            context.route('**/assets/devir-odak-v23.webp*',fail);page=context.new_page();ready('tasarim-masasi/')
            page.wait_for_selector('.studio-preset-grid .image-unavailable',timeout=15000)
            assert len(attempts)<=2,attempts
            assert page.locator('.studio-preset-grid>a').count()==3 and page.locator('.studio-preset-grid .image-unavailable').count()==1
            assert page.locator('.studio-preset-grid>a').first.get_attribute('href').startswith('/elif-tasarim/tasarim-masasi/')
            note('An unavailable preset retries once and preserves all three configuration links')
            context.close();browser.close()
          PY
      - name: Confirm personal root page is unchanged
        run: test "$(git hash-object ../../index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - name: Package exact source and public release
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil,subprocess
          root=Path('.');target=Path('delivery-public');target.mkdir(exist_ok=True)
          exclude={'.git','node_modules','dist','preview','evidence','.compiled','__pycache__','delivery-public','delivery-unified'}
          for name,folder,prefix in [('Elif_Tasarim_V23_1_Kaynak.zip',root,'source'),('Elif_Tasarim_V23_1_Yayin.zip',root/'dist','elif-tasarim')]:
            with zipfile.ZipFile(target/name,'w',zipfile.ZIP_DEFLATED) as z:
              for p in folder.rglob('*'):
                rel=p.relative_to(folder)
                if not p.is_file() or (folder==root and set(rel.parts)&exclude):continue
                assert p.suffix.lower() not in {'.woff','.woff2','.ttf','.otf','.eot'}
                z.write(p,Path(prefix)/rel)
          shutil.copyfile('preview/Elif_Tasarim.html',target/'Elif_Tasarim_V23_1.html')
          (target/'publication-commit.txt').write_text(subprocess.check_output(['git','rev-parse','HEAD'],text=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-unified-public-evidence
          path: elif-tasarim/source-v12/evidence/unified-live
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: elif-unified-public-delivery
          path: elif-tasarim/source-v12/delivery-public
          retention-days: 14

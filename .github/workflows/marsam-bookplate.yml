name: Publish and verify MARSAM bookplate correction
on:
  push:
    branches: [publish/marsam-bookplate-072]
    paths: [.github/workflows/marsam-bookplate.yml]
permissions:
  contents: read
env:
  SOURCE_COMMIT: 5807ac46976daadd93285a6dd5355347dd3dfbcc
  BASE_PATH: /MARSAM/
  PAGES_PREVIEW: 'true'
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OnourImpram/MARSAM
          ref: ${{ env.SOURCE_COMMIT }}
          path: .marsam-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the exact reviewed application
        working-directory: .marsam-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          npm run check > verification/bookplate-publish-check.log
          node scripts/budget.mjs
          node scripts/release-manifest.mjs
      - name: Stage only MARSAM, preserving unrelated sites
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json,subprocess,shutil,os
          root=Path('.marsam-source/dist');m=json.loads((root/'release.json').read_text())
          assert m['version']=='0.7.2' and m['formalApproval'] is False and m['sourceCommit']==os.environ['SOURCE_COMMIT']
          rows=subprocess.check_output(['git','ls-tree','-z','HEAD']).decode().split('\0')
          preserved={x.split('\t')[1]:x.split('\t')[0].split()[2]for x in rows if x and x.split('\t')[1]not in ['MARSAM','.github']}
          Path('.marsam-source/verification/bookplate-preserved.json').write_text(json.dumps(preserved,indent=2))
          assert Path('MARSAM/release.json').is_file()
          shutil.rmtree('MARSAM');shutil.copytree(root,'MARSAM')
          PY
          git add -- MARSAM
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(p.startswith('MARSAM/')for p in paths if p)
          PY
          git config user.name 'Onour Impram'
          git config user.email '215815131+OnourImpram@users.noreply.github.com'
          git commit -m 'build: MARSAM full-panel geometric background and simplified hero'
          git push origin HEAD:publish/marsam-bookplate-072
          git rev-parse HEAD > .marsam-source/verification/bookplate-host-candidate.txt
          git rev-parse HEAD:MARSAM > .marsam-source/verification/bookplate-host-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookplate-staged
          path: .marsam-source/verification/bookplate-*
          retention-days: 14
  verify-live:
    needs: stage
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.61.0-noble
    timeout-minutes: 15
    env:
      BROWSERS: chromium,firefox,webkit
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OnourImpram/MARSAM
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare browser and generated route evidence
        run: |
          npm run build
          python -m pip install --timeout 25 -q playwright==1.61.0
          python scripts/test-fonts.py
      - name: Require deliberate promotion of the exact reviewed release
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import json,os,time
          Path('verification').mkdir(exist_ok=True)
          for attempt in range(100):
              try:
                  with urlopen('https://onourimpram.github.io/MARSAM/release.json?source='+os.environ['SOURCE_COMMIT'],timeout=15)as r:m=json.load(r)
                  if m.get('sourceCommit')==os.environ['SOURCE_COMMIT']:
                      Path('verification/bookplate-live-release.json').write_text(json.dumps(m,indent=2));break
              except Exception:pass
              time.sleep(5)
          else:raise AssertionError('Expected release not public. No completion claim is authorized.')
          PY
      - name: Verify live bytes, requested removals and retained Marmara identity
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from concurrent.futures import ThreadPoolExecutor
          import json,hashlib,time
          m=json.loads(Path('verification/bookplate-live-release.json').read_text());root=m['url']
          def check(item):
              name,meta=item
              for attempt in range(3):
                  try:
                      with urlopen(root+name+'?release=bookplate072',timeout=30)as r:data=r.read();assert r.status==200
                      assert hashlib.sha256(data).hexdigest()==meta['sha256'],name
                      return name
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2)
          with ThreadPoolExecutor(max_workers=8)as pool:paths=list(pool.map(check,[(k,v)for k,v in m['files'].items()if k!='.nojekyll']))
          for locale in ['tr','en','de','zh','ru','ar','id','ms']:
              with urlopen(root+locale+'/',timeout=25)as r:html=r.read().decode()
              assert 'data-release="0.7.2"'in html and 'class="university-signature"'in html
              assert 'data-institution-status="planned"'in html and 'class="manuscript-pattern"'in html
              assert 'class="heritage-floral"'not in html and 'class="heritage-rosette"'not in html
              assert 'id="hero-search"'not in html and 'class="hero-deck"'not in html and 'class="hero-actions"'not in html
              assert 'data-open-search'in html
          with urlopen(root+'site.css?v=0.7.2',timeout=25)as r:css=r.read()
          assert hashlib.sha256(css).hexdigest()==m['files']['site.css']['sha256']
          with urlopen('https://onourimpram.github.io/',timeout=25)as r:home=r.read()
          assert hashlib.sha1(b'blob '+str(len(home)).encode()+b'\0'+home).hexdigest()=='501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          Path('verification/bookplate-live-bytes.json').write_text(json.dumps({'passed':True,'files':len(paths),'sourceCommit':m['sourceCommit'],'eightLocalesVerified':True,'personalHomepageUnchanged':True,'floralRemoved':True,'patternCoversInnerPanel':True,'rejectedHeroBlockAbsent':True,'MarmaraIdentityPreserved':True},indent=2))
          PY
      - name: Exercise actual public eight-language journeys in three engines
        shell: bash
        env:
          PREVIEW_ORIGIN: https://onourimpram.github.io
        run: |
          set -euo pipefail
          python tests/browser_e2e.py & core=$!
          python tests/scope_e2e.py & scope=$!
          python tests/heritage_e2e.py & layout=$!
          status=0
          wait "$core" || status=1
          wait "$scope" || status=1
          wait "$layout" || status=1
          exit "$status"
      - name: Capture the exact public bookplate for visual comparison
        run: |
          python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          out=Path('.browser-results/bookplate');out.mkdir(parents=True,exist_ok=True)
          with sync_playwright()as p:
              browser=p.chromium.launch();page=browser.new_page(viewport={'width':1440,'height':1000},device_scale_factor=2)
              page.goto('https://onourimpram.github.io/MARSAM/tr/',wait_until='networkidle')
              assert page.locator('body').get_attribute('data-release')=='0.7.2'
              page.locator('.heritage-art').screenshot(path=str(out/'bookplate-live-detail.png'))
              browser.close()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bookplate-live-evidence
          path: |
            verification/bookplate-live-*
            verification/reading-room-*.json
            .browser-results/reading-room/
            .browser-results/bookplate/
          include-hidden-files: true
          retention-days: 14

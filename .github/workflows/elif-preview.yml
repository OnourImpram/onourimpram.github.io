name: Elif preview build and browser QA
on:
  push:
    branches: [elif-tasarim-preview-20260923]
    paths: ['elif-build/**', '.github/workflows/elif-preview.yml']
permissions:
  contents: write
concurrency:
  group: elif-preview-build
  cancel-in-progress: false
jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and rebuild original preview
        run: |
          npm install --prefix /tmp/elif-ts --ignore-scripts --no-audit --no-fund typescript@5.8.3
          NODE_PATH=/tmp/elif-ts/node_modules node elif-build/build.cjs
          test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - name: Install isolated browser tooling
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test actual HTTP-served site
        run: |
          python -m http.server 8080 --bind 127.0.0.1 > /tmp/elif-http.log 2>&1 &
          sleep 2
          python elif-build/qa.py
      - name: Run pinned design-system-extraction contrast tool
        run: |
          mkdir -p elif-build/evidence
          curl --fail --silent --show-error 'https://raw.githubusercontent.com/maiconlara/design-system-extraction/9e84ba73b6aed6a5efe15bcdfd1276f9da48e189/scripts/contrast.py' -o /tmp/elif-contrast.py
          test "$(git hash-object /tmp/elif-contrast.py)" = 'b807b58a6c4dd963237038bc1153b5f2d42c2c6e'
          python /tmp/elif-contrast.py '#352C21' '#F6F3EC' | tee elif-build/evidence/contrast.txt
          python /tmp/elif-contrast.py '#F6F3EC' '#4A3D2E' | tee -a elif-build/evidence/contrast.txt
      - name: Commit only generated Elif preview to its isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p elif-tasarim/verification
          cp elif-build/evidence/qa.json elif-build/evidence/contrast.txt elif-tasarim/verification/
          cp elif-build/polish.js elif-tasarim/source/
          git config user.name 'Elif Preview Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elif-tasarim
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'build(elif): verified reference-synthesis preview'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:elif-tasarim-preview-20260923
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v3-preview-and-evidence
          path: |
            elif-tasarim
            elif-build/evidence
          retention-days: 14

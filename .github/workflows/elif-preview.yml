name: Assemble Elif preview

on:
  push:
    branches: [main]
    paths:
      - 'elif-tasarim/_transfer/**'
      - 'elif-tasarim/unpack.py'
      - '.github/workflows/elif-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: elif-preview-assembly
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout the publication branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Verify transport and generate static files
        shell: bash
        run: |
          set -euo pipefail
          BEFORE=$(git hash-object index.html)
          python3 elif-tasarim/unpack.py
          node --check elif-tasarim/app.js
          test "$BEFORE" = "$(git hash-object index.html)"
          test -f elif-tasarim/index.html
          test -f elif-tasarim/assets/dining.avif
      - name: Commit only the Elif draft
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- elif-tasarim
          if git diff --cached --quiet; then
            echo 'Preview is already current.'
          else
            git commit -m 'build: materialize verified Elif static preview'
            git push origin HEAD:main
          fi

name: Elif V21 live report verification
on:
  push:
    branches: [elif-v21-rapor-20260927]
    paths: ['.github/workflows/elif-v21-live.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 43f809698693907856c51876155cf717c4faccec
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild the exact approved V21 publication
        working-directory: elif-tasarim/source-v12
        run: |
          set -euo pipefail
          mkdir -p evidence/v21-live
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee evidence/v21-live/build.txt
          cmp dist/release-v21.json ../release-v21.json
          npm run verify:dist
          npm run launch:check
      - name: Check every live public file and direct route
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/v21-live/public
        run: python tests/v11/public_verify.py
      - name: Install isolated Chromium tooling
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Test the real published draft, contact, model and camera flows
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/v21-live/report xvfb-run -a python tests/v21/acceptance.py | tee evidence/v21-live/report.txt
          EVIDENCE_DIR=evidence/v21-live/exports xvfb-run -a python tests/v20/acceptance.py | tee evidence/v21-live/exports.txt
          EVIDENCE_DIR=evidence/v21-live/decisions xvfb-run -a python tests/v11/acceptance.py | tee evidence/v21-live/decisions.txt
          EVIDENCE_DIR=evidence/v21-live/orbit xvfb-run -a python tests/v12/acceptance.py | tee evidence/v21-live/orbit.txt
          EVIDENCE_DIR=evidence/v21-live/matrix xvfb-run -a python tests/v11/matrix.py | tee evidence/v21-live/matrix.txt
      - name: Verify the personal root homepage was preserved
        run: test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v21-live-evidence
          path: elif-tasarim/source-v12/evidence/v21-live
          retention-days: 14

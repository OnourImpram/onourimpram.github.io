name: Elif V9 final release gates
on:
  push:
    branches: [elif-v9-bilateral-studio-20260924]
    paths: ['.github/workflows/elif-v9-final.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore exact prepared V9 sources
        env:
          PACKAGE_URL: 'https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-0fe0-8210-8e0e-7bfa5a17f865/raw?se=2026-09-24T20%3A41%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=4edc9523-9bb8-5c6c-a3fb-598bb9e4093e&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T19%3A23%3A52Z&ske=2026-09-25T19%3A23%3A52Z&sks=b&skv=2026-02-06&sig=y5/UCDXKQveBxW6s6ZkZkD7vdoq1iyp7dQGZFhPQbhs%3D'
        run: |
          set -euo pipefail
          echo "::add-mask::$PACKAGE_URL"
          cp -a elif-tasarim/source-v9 elif-v9-work
          curl --fail --location --silent --show-error --max-time 60 "$PACKAGE_URL" -o /tmp/v9-final.zip
          echo '29084ff7c159a20ecfed1b6069a39fb90774c4f554207427f69ebfe3d87afaea  /tmp/v9-final.zip' | sha256sum -c
          python - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('/tmp/v9-final.zip') as z:
              assert len(z.infolist())<500 and sum(i.file_size for i in z.infolist())<5000000
              for i in z.infolist():
                  p=pathlib.PurePosixPath(i.filename)
                  assert not p.is_absolute() and '..' not in p.parts
                  assert p.parts[0] in {'src','public','tools','tests','docs','README.md','package.json','package-lock.json'}
                  assert not ((i.external_attr>>16)&0o170000)==0o120000
              z.extractall('elif-v9-work')
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean build and unit checks
        working-directory: elif-v9-work
        run: |
          set -euo pipefail
          mkdir -p evidence/v9
          npm ci --ignore-scripts --no-audit --no-fund
          npm test 2>&1 | tee evidence/v9/units.txt
          npm run typecheck:core 2>&1 | tee evidence/v9/types.txt
          npm run build 2>&1 | tee evidence/v9/build.txt
      - name: Install browser tools
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Real WebGL, reduced motion and existing customer flows
        working-directory: elif-v9-work
        env:
          BASE_URL: http://127.0.0.1:8080/elif-tasarim/
        run: |
          set -euo pipefail
          mkdir -p /tmp/elif-v9-http
          ln -s "$PWD/dist" /tmp/elif-v9-http/elif-tasarim
          python -m http.server 8080 --bind 127.0.0.1 --directory /tmp/elif-v9-http >/tmp/v9-http.log 2>&1 &
          sleep 2
          WRITE_POSTERS=1 python tests/v9/browser.py 2>&1 | tee evidence/v9/browser.txt
          npm run build 2>&1 | tee evidence/v9/build-poster.txt
          cp dist/release-v9.json /tmp/v9-before.json
          npm run build >/dev/null
          cmp /tmp/v9-before.json dist/release-v9.json
          python tests/v8/browser.py 2>&1 | tee evidence/v9/regression.txt
      - name: All routes, reflow and file integrity
        working-directory: elif-v9-work
        run: |
          set -euo pipefail
          npm run verify:dist | tee evidence/v9/integrity.txt
          python - <<'PY'
          import json,pathlib
          from playwright.sync_api import sync_playwright
          out=pathlib.Path('evidence/v9');manifest=json.loads(pathlib.Path('dist/release-v9.json').read_text());records=[];errors=[]
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=b.new_page();page.on('pageerror',lambda e:errors.append(str(e)))
              for width in [390,768,1440]:
                  page.set_viewport_size({'width':width,'height':1000})
                  for route in manifest['routes']:
                      response=page.goto('http://127.0.0.1:8080/elif-tasarim/'+route.lstrip('/')+('/' if route!='/' else ''),wait_until='domcontentloaded')
                      page.wait_for_timeout(100)
                      result=page.evaluate('({overflow:document.documentElement.scrollWidth>innerWidth+1,h1:document.querySelectorAll("#app h1").length,broken:[...document.querySelectorAll("#app img")].filter(e=>e.complete&&e.naturalWidth===0).length})')
                      records.append({'route':route,'width':width,'status':response.status,**result})
              b.close()
          (out/'matrix.json').write_text(json.dumps({'records':records,'errors':errors},indent=2))
          assert not errors and all(r['status']==200 and r['h1']==1 and not r['overflow'] and not r['broken'] for r in records)
          print('PASS',len(records),'route and viewport pairs')
          PY
      - name: Commit reviewed files only to release branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          rsync -a --exclude=node_modules --exclude=dist --exclude=evidence --exclude=preview --exclude=__pycache__ --exclude=.compiled elif-v9-work/ elif-tasarim/source-v9/
          cp -a elif-v9-work/dist elif-v9-reviewed
          git config user.name 'Elif Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add elif-tasarim/source-v9 elif-v9-reviewed
          git diff --cached --quiet && exit 0
          git commit -m 'build(elif): verified V9 bilateral atelier and editorial release candidate'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:elif-v9-bilateral-studio-20260924
      - name: Package editable sources and release evidence
        if: always()
        shell: python
        run: |
          import pathlib,zipfile
          root=pathlib.Path('elif-v9-work');out=pathlib.Path('v9-delivery');out.mkdir(exist_ok=True)
          excluded={'node_modules','.git','.compiled','__pycache__','preview'}
          with zipfile.ZipFile(out/'Elif_Tasarim_V9_Kaynak_ve_Kanit.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file() and not excluded.intersection(p.relative_to(root).parts) and p.suffix.lower() not in {'.woff','.woff2','.ttf','.otf'}:z.write(p,p.relative_to(root))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v9-final-reviewed-package
          path: v9-delivery
          retention-days: 14

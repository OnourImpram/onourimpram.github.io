name: Publish and verify MARSAM matte research release
on:
  push:
    branches: [publish/marsam-matte-research-08]
    paths: [.github/workflows/marsam-matte-research.yml]
permissions:
  contents: read
env:
  SOURCE_COMMIT: 91703cb6a91c03b67840965589f8c42bda477a73
  BASE_PATH: /MARSAM/
  PAGES_PREVIEW: 'true'
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: OnourImpram/MARSAM
          ref: ${{ env.SOURCE_COMMIT }}
          path: .marsam-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and bind the exact source to generated bytes
        working-directory: .marsam-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p verification
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          npm run check > verification/matte-publish-check.log
          node scripts/budget.mjs
          node scripts/release-manifest.mjs
      - name: Replace only the generated MARSAM directory
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os,subprocess,shutil
          root=Path('.marsam-source/dist');m=json.loads((root/'release.json').read_text())
          assert m['version']=='0.8.0' and m['sourceCommit']==os.environ['SOURCE_COMMIT']
          assert m['formalApproval'] is False and m['humanLanguageReview'] is False
          assert len(list((root/'research-downloads').iterdir()))==13
          assert not any(p.endswith(('.ttf','.otf','.woff','.woff2','.ttc'))for p in m['files'])
          entries=subprocess.check_output(['git','ls-tree','-z','HEAD']).decode().split('\0')
          preserved={line.split('\t')[1]:line.split('\t')[0].split()[2]for line in entries if line and line.split('\t')[1]not in ['MARSAM','.github']}
          Path('.marsam-source/verification/matte-preserved-roots.json').write_text(json.dumps(preserved,indent=2))
          shutil.rmtree('MARSAM');shutil.copytree(root,'MARSAM')
          PY
          git add -- MARSAM
          python - <<'PY'
          import subprocess
          paths=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          assert all(p.startswith('MARSAM/')for p in paths if p)
          PY
          git config user.name 'Onour Impram'
          git config user.email '215815131+OnourImpram@users.noreply.github.com'
          git commit -m 'build: stage matte MARSAM panel and source-grounded research workbench'
          git push origin HEAD:publish/marsam-matte-research-08
          git rev-parse HEAD > .marsam-source/verification/matte-host-candidate.txt
          git rev-parse HEAD:MARSAM > .marsam-source/verification/matte-host-tree.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-matte-staged
          path: .marsam-source/verification/matte-*
          retention-days: 14
  verify-live:
    needs: stage
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright/python:v1.61.0-noble
    timeout-minutes: 18
    env:
      BROWSERS: chromium,firefox,webkit
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: OnourImpram/MARSAM
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare actual browsers, notebook kernel and script fonts
        run: |
          npm run build
          python -m pip install --timeout 25 -q playwright==1.61.0 nbclient==0.10.2 nbformat==5.10.4 ipykernel==6.30.1
          python scripts/test-fonts.py
          mkdir -p verification
      - name: Require explicit promotion of the exact release
        run: |
          python - <<'PY'
          from urllib.request import urlopen
          from pathlib import Path
          import json,os,time
          for attempt in range(100):
              try:
                  with urlopen('https://onourimpram.github.io/MARSAM/release.json?source='+os.environ['SOURCE_COMMIT'],timeout=15)as r:release=json.load(r)
                  if release.get('sourceCommit')==os.environ['SOURCE_COMMIT']:
                      Path('verification/matte-live-release.json').write_text(json.dumps(release,indent=2));break
              except Exception:pass
              time.sleep(5)
          else:raise AssertionError('Exact release is not public. Do not claim completion.')
          PY
      - name: Verify the exact public files and matte CSS without a cache qualifier
        run: |
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor
          from urllib.request import urlopen
          from pathlib import Path
          import json,hashlib,time
          m=json.loads(Path('verification/matte-live-release.json').read_text());root=m['url']
          def check(item):
              name,info=item
              for attempt in range(3):
                  try:
                      with urlopen(root+name+'?release=matte08',timeout=30)as r:data=r.read();assert r.status==200
                      assert hashlib.sha256(data).hexdigest()==info['sha256'],name
                      return name
                  except Exception:
                      if attempt==2:raise
                      time.sleep(2)
          with ThreadPoolExecutor(max_workers=8)as pool:paths=list(pool.map(check,[(p,v)for p,v in m['files'].items()if p not in {'.nojekyll','_headers'}]))
          for url in [root+'site.css',root+'site.css?v=0.8.0']:
              for attempt in range(50):
                  with urlopen(url,timeout=25)as r:data=r.read()
                  if hashlib.sha256(data).hexdigest()==m['files']['site.css']['sha256']:break
                  time.sleep(3)
              assert hashlib.sha256(data).hexdigest()==m['files']['site.css']['sha256'],url
          with urlopen('https://onourimpram.github.io/',timeout=25)as r:home=r.read()
          assert hashlib.sha1(b'blob '+str(len(home)).encode()+b'\0'+home).hexdigest()=='501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          Path('verification/matte-live-bytes.json').write_text(json.dumps({'passed':True,'sourceCommit':m['sourceCommit'],'publicFilesChecked':len(paths),'unqueriedAndVersionedStylesheetMatch':True,'personalHomepageUnchanged':True},indent=2))
          PY
      - name: Execute research artifacts in an actual Python and Jupyter environment
        run: python tests/research_artifacts.py
      - name: Exercise the actual live site in all three browser engines
        env:
          PREVIEW_ORIGIN: https://onourimpram.github.io
        shell: bash
        run: |
          set -euo pipefail
          timeout 420 python tests/browser_e2e.py & core=$!
          timeout 420 python tests/scope_e2e.py & scope=$!
          timeout 420 python tests/heritage_e2e.py & layout=$!
          timeout 420 python -u tests/research_e2e.py & research=$!
          status=0
          wait "$core" || status=1
          wait "$scope" || status=1
          wait "$layout" || status=1
          wait "$research" || status=1
          exit "$status"
      - name: Write a final receipt only after all live checks pass
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,os
          reports={}
          for name in ['reading-room-core','reading-room-scope','reading-room-layout','research-browser','research-artifacts']:
              data=json.loads(Path('verification',name+'.json').read_text());assert data['success'],name
              reports[name]={'success':True,'passed':data.get('passed',len(data.get('checks',[]))),'browsers':data.get('browsers')}
          Path('verification/matte-live-final.json').write_text(json.dumps({'version':'0.8.0','sourceCommit':os.environ['SOURCE_COMMIT'],'liveURL':'https://onourimpram.github.io/MARSAM/','success':True,'reports':reports,'humanLanguageReview':False,'scientificApproval':False,'quartoRendered':False,'notebookExecuted':True},indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marsam-matte-research-live
          path: |
            verification/matte-live-*
            verification/reading-room-*.json
            verification/research-*
            .browser-results/research/
            .browser-results/reading-room/
          include-hidden-files: true
          retention-days: 14

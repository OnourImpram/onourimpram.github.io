name: Elif supplied portfolio media
on:
  push:
    branches: [elif-v23-unified-studio-20261001]
    paths: ['.github/workflows/elif-import-archive-media.yml']
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: elif-v23-unified-studio-20261001
      - name: Import explicit image allowlist and verify transfer digest
        env:
          MEDIA_URL: 'https://sdmntprpolandcentral.oaiusercontent.com/files/00000000-e1fc-820a-9261-ba550af83ccc/raw?se=2026-10-01T09%3A24%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=867dbde3-8e31-5c17-8dd4-c0795f50518d&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T08%3A59%3A47Z&ske=2026-10-02T08%3A59%3A47Z&sks=b&skv=2026-02-06&sig=NO4kjvhM/B1odLNY3j8v4CzoQNOlpINbCUo%2Botb2Q2Y%3D'
        run: |
          python - <<'PY'
          import os,urllib.request,hashlib,zipfile,io
          from pathlib import Path
          data=urllib.request.urlopen(os.environ['MEDIA_URL'],timeout=45).read()
          assert hashlib.sha256(data).hexdigest()=='a7b2ce0c8ff0a75a2c6ccae6403bf130b735f5325fbbf58e56e04650b9c707c9'
          allowed={'r%02d-full.webp'%i for i in [3,11,16,17,20,21,24,25,26]}
          z=zipfile.ZipFile(io.BytesIO(data));assert set(z.namelist())==allowed
          target=Path('elif-tasarim/source-v12/public/assets')
          for name in sorted(allowed):
            p=target/name;assert not p.exists(),name
            body=z.read(name);assert body[:4]==b'RIFF' and body[8:12]==b'WEBP'
            p.write_bytes(body);print(name,len(body),hashlib.sha256(body).hexdigest())
          PY
      - name: Commit only newly supplied source media
        run: |
          set -euo pipefail
          git add elif-tasarim/source-v12/public/assets/r03-full.webp elif-tasarim/source-v12/public/assets/r11-full.webp elif-tasarim/source-v12/public/assets/r16-full.webp elif-tasarim/source-v12/public/assets/r17-full.webp elif-tasarim/source-v12/public/assets/r20-full.webp elif-tasarim/source-v12/public/assets/r21-full.webp elif-tasarim/source-v12/public/assets/r24-full.webp elif-tasarim/source-v12/public/assets/r25-full.webp elif-tasarim/source-v12/public/assets/r26-full.webp
          test "$(git diff --cached --name-only | wc -l)" = 9
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(elif): add remaining user-supplied archive photographs'
          git push origin HEAD:elif-v23-unified-studio-20261001

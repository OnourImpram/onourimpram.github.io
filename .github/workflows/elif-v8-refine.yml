name: Elif V8 refined Three studio
on:
  push:
    branches: [elif-v8-three-studio-20260924]
    paths: ['.github/workflows/elif-v8-refine.yml']
permissions:
  contents: write
jobs:
  studio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore approved V8 source archive
        env:
          PACKAGE_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-67a0-81f4-a4ee-ad44e7442e8b/raw?se=2026-09-24T17%3A38%3A21Z&sp=r&sv=2026-02-06&sr=b&scid=1ea19dc8-b009-50ab-847f-355af6e8edfa&skoid=76024c37-11e2-4c92-aa07-7e519fbe2d0f&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-24T16%3A38%3A19Z&ske=2026-09-25T16%3A38%3A19Z&sks=b&skv=2026-02-06&sig=UnRlbyD40SZcz2Hg29XVnU3p7SnABZ8EJmQ8yctIjj8%3D'
        run: |
          echo "::add-mask::$PACKAGE_URL"
          curl --fail --location --silent --show-error --max-time 90 "$PACKAGE_URL" -o /tmp/v8.zip
          echo 'f6714696b5b4821aff42d7bd429f784c92528c79419a379a1da4812602479453  /tmp/v8.zip' | sha256sum --check
          python - <<'PY'
          import zipfile,pathlib
          z=zipfile.ZipFile('/tmp/v8.zip')
          assert len(z.infolist())<500 and sum(i.file_size for i in z.infolist())<80000000
          for i in z.infolist():
            p=pathlib.PurePosixPath(i.filename)
            assert not p.is_absolute() and '..' not in p.parts
            assert p.parts[0] in ['src','public','tools','tests','docs','package.json']
            assert not ((i.external_attr>>16)&0o170000)==0o120000
          z.extractall('elif-v8-work')
          PY
      - name: Unit and deterministic build checks
        run: |
          set -euo pipefail
          cd elif-v8-work
          mkdir -p evidence/v8
          npm install --ignore-scripts --no-audit --no-fund
          npm test | tee evidence/v8/unit.txt
      - name: Install isolated browser tools
        run: |
          python -m pip install playwright==1.55.0 pillow
          python -m playwright install --with-deps chromium
      - name: Test real WebGL mechanics and create model-matched posters
        run: |
          mkdir /tmp/elif-v8-http
          ln -s "$PWD/elif-v8-work/dist" /tmp/elif-v8-http/elif-tasarim
          python -m http.server 8080 --bind 127.0.0.1 --directory /tmp/elif-v8-http >/tmp/elif-http.log 2>&1 &
          sleep 1
          cd elif-v8-work
          WRITE_POSTERS=1 python tests/v8/browser.py
          cp public/assets/devir-poster.webp public/assets/office-v8.webp
          cp public/assets/devir-poster.webp public/assets/office.webp
          npm run build
          npm run verify:dist
      - name: Preserve verified Elif output and reproducible source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          rm -rf elif-tasarim
          cp -a elif-v8-work/dist elif-tasarim
          mkdir -p elif-tasarim/source-v8
          cp -a elif-v8-work/src elif-v8-work/tools elif-v8-work/tests elif-v8-work/docs elif-v8-work/public elif-tasarim/source-v8/
          cp elif-v8-work/package.json elif-v8-work/package-lock.json elif-tasarim/source-v8/
          cp elif-v8-work/docs/V8_README.md elif-tasarim/source-v8/README.md
          git add elif-tasarim
          git config user.name 'Elif Preview Build'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(elif): V8 real Three.js desk with drawers, rotating return and source-matched renders'
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:elif-v8-three-studio-20260924
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v8-refined-studio
          path: |
            elif-v8-work/dist
            elif-v8-work/evidence
            elif-v8-work/src
            elif-v8-work/tools
            elif-v8-work/public
            elif-v8-work/tests
            elif-v8-work/docs
            elif-v8-work/package.json
            elif-v8-work/package-lock.json
          retention-days: 7

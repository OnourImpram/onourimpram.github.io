name: Elif V20 source snapshot
on:
  push:
    branches: [elif-v20-final-20260926]
    paths: ['.github/workflows/elif-v20-source.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare local editable source and compiler
        working-directory: elif-tasarim/source-v12
        run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/upload-artifact@v4
        with:
          name: elif-v20-source-baseline
          path: elif-tasarim/source-v12
          include-hidden-files: true
          retention-days: 7

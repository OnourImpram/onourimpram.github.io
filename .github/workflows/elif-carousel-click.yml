name: Elif carousel and direct storage interaction
on:
  push:
    branches: [elif-carousel-click-20261001]
    paths:
      - '.github/workflows/elif-carousel-click.yml'
      - '.github/elif-interaction/**'
      - 'elif-tasarim/source-v12/tests/v23-interaction/**'
permissions:
  contents: write
concurrency:
  group: elif-carousel-click-publication
  cancel-in-progress: false
jobs:
  verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: elif-tasarim/source-v12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply only exact baseline source changes
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          base=Path('.').resolve()
          changes=json.loads(Path('../../.github/elif-interaction/changes.json').read_text())
          for item in changes:
            p=(base/item['path']).resolve();assert p.is_relative_to(base)
            raw=p.read_bytes();assert hashlib.sha256(raw).hexdigest()==item['before'],('Baseline changed',item['path'])
            text=raw.decode()
            for start,end,replacement in reversed(item['edits']):text=text[:start]+replacement+text[end:]
            assert hashlib.sha256(text.encode()).hexdigest()==item['after'],('Transfer mismatch',item['path'])
            p.write_text(text)
          Path('evidence/interaction').mkdir(parents=True,exist_ok=True)
          Path('docs/v23-interaction').mkdir(parents=True,exist_ok=True)
          Path('docs/v23-interaction/RELEASE.md').write_text('V23.2. User-authorized five-image rotating hero and direct drawer/cabinet interaction. All imagery already belongs to the project and concepts remain labeled. Pause, reduced motion, keyboard controls, state synchronization, drag threshold and multitouch cancellation included. No separate Devir page restored. No message sent. Release is confirmed only after exact public manifest and live browser checks.\n')
          PY
      - name: Clean build and all source regressions
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee evidence/interaction/build.txt
          npm test | tee evidence/interaction/unit.txt
          npm run typecheck:core | tee evidence/interaction/types.txt
          npm run verify:dist | tee evidence/interaction/integrity.txt
      - name: Install real browser
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Start isolated HTTP preview
        run: |
          node tools/serve-static.cjs dist 8000 > /tmp/elif-preview.log 2>&1 &
          for i in {1..15}; do curl -fsS http://127.0.0.1:8000/elif-tasarim/release-v23.json >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Actual carousel, mouse, touch and synchronized model state
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
          EVIDENCE_DIR: evidence/interaction/stage
        run: python tests/v23-interaction/browser.py
      - name: Preserve 360-degree camera and contact flows
        env:
          BASE_URL: http://127.0.0.1:8000/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/interaction/orbit xvfb-run -a python tests/v12/acceptance.py
          EVIDENCE_DIR=evidence/interaction/contact xvfb-run -a python tests/v22/acceptance.py
      - name: Publish verified files without changing other projects
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = '4f98773f6f507a2f04883fc2dd198a302f1a42b7'
          P=/tmp/elif-approved-release
          git worktree add --detach "$P" origin/main
          test "$(git -C "$P" hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
          rsync -a --delete --exclude=source-v12 dist/ "$P/elif-tasarim/"
          rsync -a --delete --exclude=node_modules --exclude=dist --exclude=preview --exclude=evidence --exclude=.compiled --exclude=.git --exclude=__pycache__ ./ "$P/elif-tasarim/source-v12/"
          git -C "$P" add -- elif-tasarim
          git -C "$P" diff --cached --name-only > evidence/interaction/published-paths.txt
          python - <<'PY'
          from pathlib import Path
          files=Path('evidence/interaction/published-paths.txt').read_text().splitlines()
          assert files and all(p.startswith('elif-tasarim/') for p in files)
          PY
          git -C "$P" -c user.name='Onour Impram' -c user.email='onuribram@outlook.com' commit -m 'Elif V23.2: five-image carousel and directly operable 3D storage'
          git -C "$P" rev-parse HEAD > evidence/interaction/publication-commit.txt
          git -C "$P" push origin HEAD:main
          test "$(git -C "$P" hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - name: Wait for exact GitHub Pages deployment
        run: |
          for i in {1..60}; do
            curl -fsS "https://onourimpram.github.io/elif-tasarim/release-v23.json?verify=$GITHUB_RUN_ID" -o /tmp/current-elif.json || true
            if cmp -s dist/release-v23.json /tmp/current-elif.json; then exit 0; fi
            sleep 5
          done
          echo 'Exact release not live' >&2
          exit 1
      - name: Verify live routes and every published file
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/interaction/public
        run: python tests/v11/public_verify.py
      - name: Repeat actual user interactions on the public site
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/interaction/live
        run: python tests/v23-interaction/browser.py
      - name: Package exact delivery
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile,shutil
          root=Path('.');out=Path('delivery-interaction');out.mkdir(exist_ok=True)
          excludes={'.git','node_modules','dist','preview','evidence','.compiled','__pycache__','delivery-interaction'}
          for filename,folder,prefix in [('Elif_V23_2_Kaynak.zip',root,'source'),('Elif_V23_2_Yayin.zip',root/'dist','elif-tasarim')]:
            with zipfile.ZipFile(out/filename,'w',zipfile.ZIP_DEFLATED) as z:
              for f in folder.rglob('*'):
                rel=f.relative_to(folder)
                if not f.is_file() or (folder==root and set(rel.parts)&excludes):continue
                assert f.suffix.lower() not in {'.woff','.woff2','.ttf','.otf','.eot'}
                z.write(f,Path(prefix)/rel)
          shutil.copyfile('preview/Elif_Tasarim.html',out/'Elif_V23_2.html')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-interaction-evidence
          path: elif-tasarim/source-v12/evidence/interaction
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: elif-interaction-delivery
          path: elif-tasarim/source-v12/delivery-interaction
          retention-days: 14

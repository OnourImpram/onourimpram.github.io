name: Elif V22 final live verification
on:
  push:
    branches: [elif-v22-ux-mail-final-20260927]
    paths: ['.github/workflows/elif-v22-live-final.yml']
permissions:
  contents: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c8d6e731e14f558c0f596966d97507866816f10f
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild and retest the exact published source
        working-directory: elif-tasarim/source-v12
        run: |
          set -euo pipefail
          mkdir -p evidence/v22-live
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build | tee evidence/v22-live/build.txt
          npm test | tee evidence/v22-live/unit.txt
          npm run typecheck:core | tee evidence/v22-live/types.txt
          npm run verify:dist | tee evidence/v22-live/integrity.txt
          npm run launch:check | tee evidence/v22-live/launch.txt
          cmp dist/release-v22.json ../release-v22.json
      - name: Verify every public file and direct route
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
          EVIDENCE_DIR: evidence/v22-live/public
        run: python tests/v11/public_verify.py
      - name: Install isolated browser tooling
        run: |
          python -m pip install playwright==1.55.0 Pillow==11.3.0
          python -m playwright install --with-deps chromium
      - name: Exercise actual email handoff, recovery, exports and full orbit
        working-directory: elif-tasarim/source-v12
        env:
          BASE_URL: https://onourimpram.github.io/elif-tasarim/
        run: |
          set -euo pipefail
          EVIDENCE_DIR=evidence/v22-live/customer xvfb-run -a python tests/v22/acceptance.py | tee evidence/v22-live/customer.txt
          EVIDENCE_DIR=evidence/v22-live/recovery xvfb-run -a python tests/v21/acceptance.py | tee evidence/v22-live/recovery.txt
          EVIDENCE_DIR=evidence/v22-live/exports xvfb-run -a python tests/v20/acceptance.py | tee evidence/v22-live/exports.txt
          EVIDENCE_DIR=evidence/v22-live/decisions xvfb-run -a python tests/v11/acceptance.py | tee evidence/v22-live/decisions.txt
          EVIDENCE_DIR=evidence/v22-live/orbit xvfb-run -a python tests/v12/acceptance.py | tee evidence/v22-live/orbit.txt
          EVIDENCE_DIR=evidence/v22-live/matrix xvfb-run -a python tests/v11/matrix.py | tee evidence/v22-live/matrix.txt
      - name: Confirm personal homepage unchanged
        run: test "$(git hash-object index.html)" = '501229ef0c1d25dbc4554e27ca089b03e590c7e0'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elif-v22-live-final-evidence
          path: elif-tasarim/source-v12/evidence/v22-live
          retention-days: 14

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Moved to onourimpram.com</title>

    <!--
      This showcase page has been retired. Its content now lives on
      onourimpram.com, which is the canonical personal site.

      GitHub does not allow a user Pages site (<user>.github.io) to be
      deactivated, so the page is turned into a redirect instead of being
      taken down. Three layers, because none of them is guaranteed on its own:
      canonical for crawlers, meta refresh for clients without JavaScript,
      and location.replace so the entry does not pollute browser history.

      Deliberately NOT noindex: consolidating an old URL into a new one needs
      the crawler to read this page and follow the canonical. A noindex would
      stop it from doing that.

      The per-project documentation sites under this domain
      (/mneme/, /mergen/, /routeledger/, /vocation-os/,
      /claude-code-for-social-scientists/) are served from their own
      repositories and are unaffected.
    -->
    <link rel="canonical" href="https://onourimpram.com/en/open-source" />
    <meta http-equiv="refresh" content="0; url=https://onourimpram.com/en/open-source" />

    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 32px;
        background: #12161c;
        color: #e8e4dc;
        font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
        text-align: center;
      }
      main { max-width: 46ch; }
      a { color: #d8b26a; }
    </style>
  </head>
  <body>
    <main>
      <p>This page has moved to <a href="https://onourimpram.com/en/open-source">onourimpram.com</a>.</p>
      <p>If you are not redirected, follow the link above.</p>
    </main>
    <script>
      location.replace("https://onourimpram.com/en/open-source");
    </script>
  </body>
</html>

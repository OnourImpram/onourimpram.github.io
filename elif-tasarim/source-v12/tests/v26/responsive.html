<!doctype html><html lang="en"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Local responsive review</title>
<style>body{margin:0;background:#ddd;font:14px system-ui}header{position:sticky;left:0;top:0;padding:12px;background:white;display:flex;gap:20px;z-index:2}label{display:flex;align-items:center;gap:8px}select{font:inherit;padding:8px}iframe{display:block;border:0;background:white;min-height:1050px}output{align-self:center}</style>
<header><label>Viewport width<select id="width"></select></label><label>Page<select id="page"></select></label><output id="size"></output></header>
<iframe id="site" title="Elif responsive review"></iframe>
<script>
const widths=[320,375,390,430,768,1024,1280,1440,1920];
const routes=['','projeler','ilham-modelleri','calisma-dosyam','modelini-getir','tasarim-masasi','kategoriler/mutfak','kategoriler/baza-yatak','iletisim','kolay-iletisim','hakkimizda','atolye','malzemeler','hizmet-ve-teklif','rehber','gizlilik'];
for(const w of widths)width.add(new Option(w+' px',w));
for(const r of routes)page.add(new Option(r||'home',r));
width.value='390';
function resize(){site.style.width=width.value+'px';size.textContent=width.value+' × 1050 CSS pixels'}
function visit(){site.src='/elif-tasarim/'+(page.value?page.value+'/':'')}
width.addEventListener('change',resize);page.addEventListener('change',visit);resize();visit();
</script></html>

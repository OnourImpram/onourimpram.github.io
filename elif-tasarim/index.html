:root {
  --paper:#f4f2e9;
  --paper-deep:#e9e6db;
  --ink:#25362e;
  --olive:#2b3d33;
  --muted:#657067;
  --line:#d6d8cc;
  --wood:#76513c;
  --accent:#ae8862;
  --white:#fbfaf5;
  --serif:'Bodoni MT','Didot','Iowan Old Style','EB Garamond',Georgia,serif;
  --sans:'Helvetica Neue',Arial,sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1)
}
* {
  box-sizing:border-box
}
html {
  scroll-behavior:smooth;
  scroll-padding-top:115px
}
body {
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  -webkit-font-smoothing:antialiased
}
button,input,select,textarea {
  font:inherit
}
button,a,input,select,textarea {
  -webkit-tap-highlight-color:transparent
}
button {
  cursor:pointer;
  color:inherit
}
a {
  color:inherit;
  text-decoration:none
}
button {
  border:0;
  background:none
}
button:disabled {
  cursor:not-allowed;
  opacity:.4
}
a,button {
  touch-action:manipulation
}
img {
  display:block;
  max-width:100%
}
figure {
  margin:0
}
p {
  line-height:1.8;
  margin:0 0 20px
}
h1,h2,h3 {
  font-family:var(--serif);
  font-weight:400;
  margin:0
}
h1 {
  font-size:clamp(52px,6.2vw,92px);
  line-height:1.03;
  letter-spacing:-2px
}
h2 {
  font-size:clamp(40px,4.25vw,64px);
  line-height:1.07;
  letter-spacing:-1.1px
}
h3 {
  font-size:30px;
  line-height:1.15
}
em {
  font-weight:400
}
small,.small {
  font-size:13px;
  line-height:1.7
}
.muted {
  color:var(--muted)
}
strong {
  font-weight:500
}
svg {
  flex-shrink:0
}
main:focus {
  outline:0
}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible {
  outline:2px solid var(--wood);
  outline-offset:5px
}
::selection {
  background:#d7c3a7;
  color:var(--ink)
}
.wrap {
  width:calc(100% - 112px);
  max-width:1392px;
  margin-inline:auto
}
.section {
  padding-block:104px
}
.eyebrow,.label,.field-label {
  font-family:var(--sans);
  font-size:11px;
  font-weight:500;
  letter-spacing:2px;
  line-height:1.65
}
.eyebrow {
  margin-bottom:24px
}
.label {
  letter-spacing:1.55px;
  color:var(--muted)
}
.text-link {
  display:inline-flex;
  align-items:center;
  justify-content:space-between;
  gap:28px;
  font-size:13px;
  border-bottom:1px solid currentColor;
  padding:8px 0;
  min-height:44px;
  transition:gap .2s;
  line-height:1.4
}
.text-link:hover {
  gap:38px
}
.text-link.on-dark {
  color:var(--paper)
}
.button {
  display:inline-flex;
  justify-content:center;
  align-items:center;
  gap:27px;
  min-height:54px;
  background:var(--olive);
  border:1px solid var(--olive);
  color:var(--white);
  padding:15px 24px;
  font-size:13px;
  line-height:1.6;
  transition:background .2s,color .2s,transform .2s;
  text-align:center
}
.button:hover:not(:disabled) {
  background:#405044
}
.button svg {
  transition:transform .2s
}
.button:hover svg {
  transform:translateX(3px)
}
.button-outline {
  background:transparent;
  color:var(--ink);
  border-color:#a3aca3
}
.button-outline:hover:not(:disabled) {
  background:var(--paper-deep);
  color:var(--ink)
}
.icon-button {
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  position:relative;
  flex-shrink:0
}
.icon-button:hover {
  background:#e7e7de
}
.skip-link {
  position:fixed;
  top:-100px;
  left:20px;
  z-index:100;
  background:var(--ink);
  color:white;
  padding:18px
}
.skip-link:focus {
  top:12px
}
.preview-bar {
  height:32px;
  background:var(--ink);
  color:var(--paper);
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 40px;
  font-size:11px;
  letter-spacing:.4px
}
.preview-bar span {
  display:flex;
  gap:10px;
  align-items:center
}
.preview-bar i {
  width:3px;
  height:3px;
  background:#b7c0b4;
  border-radius:50%
}
.preview-bar button {
  display:flex;
  align-items:center;
  gap:8px;
  color:inherit;
  padding:7px 0;
  font-size:11px
}
.site-header {
  position:sticky;
  top:0;
  background:rgba(244,242,233,.98);
  z-index:30;
  border-bottom:1px solid var(--line)
}
.header-inner {
  max-width:1600px;
  padding:0 40px;
  margin:auto;
  min-height:106px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  gap:24px;
  align-items:center
}
.nav-left,.nav-right,.nav-right nav {
  display:flex;
  align-items:center;
  gap:26px
}
.nav-left a,.nav-right nav a {
  font-size:12px;
  padding:15px 0;
  white-space:nowrap;
  position:relative
}
.nav-left a:after,.nav-right nav a:after {
  content:'';
  position:absolute;
  bottom:9px;
  left:0;
  right:0;
  height:1px;
  background:var(--ink);
  transform:scaleX(0);
  transform-origin:left;
  transition:transform .25s
}
.nav-left a:hover:after,.nav-right nav a:hover:after,a[aria-current=page]:after {
  transform:scaleX(1)
}
.brand {
  display:flex;
  align-items:center;
  gap:13px;
  white-space:nowrap
}
.brand img {
  height:55px;
  width:16px;
  object-fit:contain
}
.brand>span {
  font-family:var(--serif);
  font-size:23px;
  letter-spacing:3px;
  line-height:1.2
}
.brand small {
  display:block;
  font-family:var(--sans);
  font-size:7px;
  letter-spacing:1.5px;
  margin-top:7px
}
.nav-right {
  justify-content:flex-end;
  gap:17px
}
.header-tools {
  display:flex;
  gap:0
}
.cart-nav {
  width:57px;
  gap:7px;
  font-size:12px
}
.nav-dot {
  position:absolute;
  right:8px;
  top:8px;
  width:5px;
  height:5px;
  background:var(--wood);
  border-radius:50%
}
.is-saved svg {
  fill:var(--wood);
  stroke:var(--wood)
}
.mobile-menu {
  display:none
}
.hero {
  display:grid;
  grid-template-columns:.95fr 1.05fr;
  align-items:center;
  padding-top:46px;
  padding-bottom:0;
  column-gap:25px
}
.hero-copy {
  padding:0 0 24px 0;
  position:relative;
  z-index:1
}
.hero-copy .eyebrow {
  font-size:10px;
  letter-spacing:2px;
  margin-bottom:38px
}
.hero-copy h1 {
  font-size:clamp(56px,5.8vw,87px);
  letter-spacing:-2.5px;
  line-height:1.08;
  margin-bottom:30px
}
.hero-copy h1 em {
  color:#6b7669
}
.hero-copy p {
  font-size:14px;
  color:#58655b;
  line-height:1.85;
  margin-bottom:31px;
  max-width:460px
}
.hero-actions {
  display:flex;
  align-items:center;
  gap:24px;
  flex-wrap:wrap
}
.hero-art {
  position:relative;
  height:560px;
  align-self:stretch;
  background:#ded4c0
}
.hero-art .photo {
  height:100%
}
.hero-art img {
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:47% center
}
.hero-art:after {
  content:'';
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:160px;
  background:linear-gradient(transparent,rgba(24,26,19,.5));
  pointer-events:none
}
.hero-caption {
  position:absolute;
  bottom:36px;
  left:27px;
  right:27px;
  z-index:1;
  color:var(--white);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px
}
.hero-caption span {
  display:block;
  font-size:9px;
  letter-spacing:1.7px;
  margin-bottom:9px
}
.hero-caption strong {
  font-family:var(--serif);
  font-size:24px
}
.round-link {
  width:51px;
  height:51px;
  display:flex;
  align-items:center;
  justify-content:center;
  border:1px solid #d0c6b0;
  border-radius:50%;
  transition:background .3s
}
.round-link:hover {
  background:#ffffff25
}
.photo-disclaimer {
  position:absolute;
  bottom:10px;
  left:27px;
  right:10px;
  color:#faf7eb;
  font-size:9px;
  letter-spacing:.25px;
  z-index:2
}
.hero-bottom {
  grid-column:1/-1;
  display:flex;
  align-items:center;
  gap:45px;
  padding:28px 0 27px;
  border-bottom:1px solid var(--line);
  font-size:9px;
  letter-spacing:1.25px;
  color:var(--muted)
}
.scroll-note {
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:10px;
  text-transform:none;
  font-size:11px;
  letter-spacing:0
}
.photo {
  position:relative;
  overflow:hidden;
  background:#ded6c5
}
.photo img {
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .7s var(--ease)
}
.photo figcaption {
  position:absolute;
  bottom:9px;
  left:12px;
  color:var(--white);
  font-size:9px;
  text-shadow:0 1px 3px #0009;
  background:#27332975;
  padding:3px 6px;
  line-height:1.5
}
.section-head {
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:40px;
  margin-bottom:45px
}
.section-head .eyebrow {
  margin-bottom:20px
}
.section-head h2 {
  font-size:55px
}
.section-head p {
  font-size:14px;
  margin:18px 0 0;
  color:var(--muted)
}
.section-head>.text-link {
  margin-bottom:7px
}
.featured-products {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:28px
}
.product-card {
  min-width:0
}
.product-visual {
  position:relative;
  overflow:hidden;
  aspect-ratio:4/4.15;
  background:#e6dfd1
}
.product-visual>a {
  display:block;
  height:100%
}
.product-visual img {
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .7s var(--ease)
}
.product-card:hover .product-visual img {
  transform:scale(1.035)
}
.product-visual .image-index {
  position:absolute;
  left:17px;
  top:17px;
  font-size:9px;
  letter-spacing:1.1px;
  background:var(--paper);
  padding:7px 9px;
  color:var(--ink)
}
.save-button {
  position:absolute;
  right:12px;
  top:12px;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f4f2e9d9;
  border-radius:50%
}
.save-button:hover {
  background:var(--paper)
}
.product-caption {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:24px 0 8px;
  border-bottom:1px solid var(--line);
  gap:10px
}
.product-caption h3 {
  font-size:35px;
  margin:3px 0 8px
}
.product-caption p {
  font-size:11px;
  color:var(--muted);
  margin-bottom:12px
}
.product-caption .label {
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1.5px
}
.card-arrow {
  width:40px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center
}
.catalog-note {
  font-size:11px;
  color:var(--muted);
  margin:26px 0 0
}
.collection-section .featured-products .product-card:nth-child(2) {
  padding-top:44px
}
.collection-section .featured-products .product-card:nth-child(3) {
  padding-top:88px
}
.collection-section .featured-products .product-card:nth-child(3) .product-visual {
  aspect-ratio:4/3.2
}
.story-section {
  background:var(--olive);
  color:var(--paper);
  padding:90px 0 84px;
  margin-top:0
}
.story-grid {
  display:grid;
  grid-template-columns:1.03fr .97fr;
  gap:9%;
